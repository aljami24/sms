databaseChangeLog:
  - changeSet:
      id: create-classroom-version-section
      author: sakib
      changes:
        - createTable:
            tableName: classroom_version_section
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: class_room_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: section_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true

              # BaseEntity ফিল্ডগুলো
              - column:
                  name: created_at
                  type: timestamp

              - column:
                  name: updated_at
                  type: timestamp

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_by
                  type: VARCHAR(100)

        - addForeignKeyConstraint:
            baseTableName: classroom_version_section
            baseColumnNames: class_room_id
            constraintName: fk_cvs_class_room
            referencedTableName: class_room
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: classroom_version_section
            baseColumnNames: version_id
            constraintName: fk_cvs_version
            referencedTableName: version
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: classroom_version_section
            baseColumnNames: section_id
            constraintName: fk_cvs_section
            referencedTableName: section
            referencedColumnNames: id
            onDelete: SET NULL
