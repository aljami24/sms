databaseChangeLog:

  # ===== CLASS SEED (1–8) =====
  - changeSet:
      id: seed-classroom
      author: afzal
      changes:
        - insert:
            tableName: class_room
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: name, value: "Class 1" }

        - insert:
            tableName: class_room
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: name, value: "Class 2" }

        - insert:
            tableName: class_room
            columns:
              - column: { name: id, valueNumeric: 3 }
              - column: { name: name, value: "Class 3" }

        - insert:
            tableName: class_room
            columns:
              - column: { name: id, valueNumeric: 4 }
              - column: { name: name, value: "Class 4" }

        - insert:
            tableName: class_room
            columns:
              - column: { name: id, valueNumeric: 5 }
              - column: { name: name, value: "Class 5" }

        - insert:
            tableName: class_room
            columns:
              - column: { name: id, valueNumeric: 6 }
              - column: { name: name, value: "Class 6" }

        - insert:
            tableName: class_room
            columns:
              - column: { name: id, valueNumeric: 7 }
              - column: { name: name, value: "Class 7" }

        - insert:
            tableName: class_room
            columns:
              - column: { name: id, valueNumeric: 8 }
              - column: { name: name, value: "Class 8" }

  # ===== VERSION SEED =====
  - changeSet:
      id: seed-version
      author: afzal
      changes:
        - insert:
            tableName: version
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: name, value: Bangla }

        - insert:
            tableName: version
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: name, value: English }

  # ===== SECTION SEED =====
  - changeSet:
      id: seed-section
      author: afzal
      changes:
        - insert:
            tableName: section
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: name, value: A }

        - insert:
            tableName: section
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: name, value: B }

  # ===== CLASSROOM + VERSION + SECTION MAPPING =====
  - changeSet:
      id: seed-classroom-version-section
      author: afzal
      changes:

        # ----- Class 1–3 : Bangla + English with Section A,B -----
        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 1 }
              - column: { name: version_id, valueNumeric: 1 }
              - column: { name: section_id, valueNumeric: 1 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 1 }
              - column: { name: version_id, valueNumeric: 1 }
              - column: { name: section_id, valueNumeric: 2 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 1 }
              - column: { name: version_id, valueNumeric: 2 }
              - column: { name: section_id, valueNumeric: 1 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 1 }
              - column: { name: version_id, valueNumeric: 2 }
              - column: { name: section_id, valueNumeric: 2 }

        # ----- Class 2 : Bangla + English with Section A,B -----
        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 2 }
              - column: { name: version_id, valueNumeric: 1 }
              - column: { name: section_id, valueNumeric: 1 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 2 }
              - column: { name: version_id, valueNumeric: 1 }
              - column: { name: section_id, valueNumeric: 2 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 2 }
              - column: { name: version_id, valueNumeric: 2 }
              - column: { name: section_id, valueNumeric: 1 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 2 }
              - column: { name: version_id, valueNumeric: 2 }
              - column: { name: section_id, valueNumeric: 2 }


        # ----- Class 3 : Bangla + English with Section A,B -----
        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 3 }
              - column: { name: version_id, valueNumeric: 1 }
              - column: { name: section_id, valueNumeric: 1 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 3 }
              - column: { name: version_id, valueNumeric: 1 }
              - column: { name: section_id, valueNumeric: 2 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 3 }
              - column: { name: version_id, valueNumeric: 2 }
              - column: { name: section_id, valueNumeric: 1 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 3 }
              - column: { name: version_id, valueNumeric: 2 }
              - column: { name: section_id, valueNumeric: 2 }



        # ----- Class 4–5 : Bangla + English, NO SECTION -----
        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 4 }
              - column: { name: version_id, valueNumeric: 1 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 4 }
              - column: { name: version_id, valueNumeric: 2 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 5 }
              - column: { name: version_id, valueNumeric: 1 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 5 }
              - column: { name: version_id, valueNumeric: 2 }


        # ----- Class 6–8 : Only Bangla, NO SECTION -----
        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 6 }
              - column: { name: version_id, valueNumeric: 1 }

        - insert:
            tableName: classroom_version_section
            columns:
              - column: { name: class_id, valueNumeric: 7 }
              - column: { name: version_id, valueNumeric: 1 }




