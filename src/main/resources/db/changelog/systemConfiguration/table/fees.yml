databaseChangeLog:
  - changeSet:
      id: create-fees-table
      author: jami
      changes:
        - createTable:
            tableName: fees
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: fees_amount
                  type: DOUBLE

              - column:
                  name: cvs_id
                  type: BIGINT

              - column:
                  name: year_id
                  type: BIGINT

              - column:
                  name: fee_type
                  type: VARCHAR(50)

              # BaseEntity ফিল্ডগুলো
              - column:
                  name: created_at
                  type: timestamp

              - column:
                  name: updated_at
                  type: timestamp

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_by
                  type: VARCHAR(100)

        - addForeignKeyConstraint:
            baseTableName: fees
            baseColumnNames: cvs_id
            referencedTableName: classroom_version_section
            referencedColumnNames: id
            constraintName: fk_fees_cvs

        - addForeignKeyConstraint:
            baseTableName: fees
            baseColumnNames: year_id
            referencedTableName: year
            referencedColumnNames: id
            constraintName: fk_fees_year