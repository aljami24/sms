databaseChangeLog:
  - changeSet:
      id: create-tuition-fee
      author: afzal
      changes:
        - createTable:
            tableName: tuition_fee
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: amount
                  type: DOUBLE
              - column:
                  name: month
                  type: VARCHAR(20)
              - column:
                  name: year_id
                  type: BIGINT
              - column:
                  name: student_id
                  type: BIGINT
              - column:
                  name: cvs_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: updated_at
                  type: DATETIME
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)

        - addForeignKeyConstraint:
            constraintName: fk_tuition_fee_year
            baseTableName: tuition_fee
            baseColumnNames: year_id
            referencedTableName: year
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_tuition_fee_student
            baseTableName: tuition_fee
            baseColumnNames: student_id
            referencedTableName: student
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_tuition_fee_cvs
            baseTableName: tuition_fee
            baseColumnNames: cvs_id
            referencedTableName: classroom_version_section
            referencedColumnNames: id