databaseChangeLog:
  - changeSet:
      id: create-invoice
      author: afzal
      changes:
        - createTable:
            tableName: invoice
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: student_id
                  type: BIGINT

              - column:
                  name: cvs_id
                  type: BIGINT

              - column:
                  name: year_id
                  type: BIGINT

              - column:
                  name: invoice_no
                  type: VARCHAR(100)

              - column:
                  name: invoice_date
                  type: TIMESTAMP

              - column:
                  name: fee_type
                  type: VARCHAR(50)

              - column:
                  name: invoice_payment_status
                  type: VARCHAR(50)

              - column:
                  name: total_amount
                  type: DECIMAL(19,2)

              - column:
                  name: paid_amount
                  type: DECIMAL(19,2)

              - column:
                  name: due_amount
                  type: DECIMAL(19,2)

              # BaseEntity fields
              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_by
                  type: VARCHAR(100)

        # ========================
        # Foreign Keys
        # ========================

        - addForeignKeyConstraint:
            constraintName: fk_invoice_student
            baseTableName: invoice
            baseColumnNames: student_id
            referencedTableName: student
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_invoice_cvs
            baseTableName: invoice
            baseColumnNames: cvs_id
            referencedTableName: classroom_version_section
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_invoice_year
            baseTableName: invoice
            baseColumnNames: year_id
            referencedTableName: year
            referencedColumnNames: id