databaseChangeLog:
  - changeSet:
      id: create-invoice
      author: afzal
      changes:
        - createTable:
            tableName: invoice
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: student_id
                  type: BIGINT
              - column:
                  name: cvs_id
                  type: BIGINT
              - column:
                  name: year_id
                  type: BIGINT
              - column:
                  name: invoice_no
                  type: VARCHAR(100)
              - column:
                  name: payment_method
                  type: VARCHAR(50)
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: amount
                  type: DOUBLE
              - column:
                  name: payment_type_id
                  type: BIGINT
              - column:
                  name: transaction_id
                  type: VARCHAR(100)
              - column:
                  name: month
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: updated_at
                  type: DATETIME
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)

        - addForeignKeyConstraint:
            constraintName: fk_invoice_year
            baseTableName: invoice
            baseColumnNames: year_id
            referencedTableName: year
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_invoice_student
            baseTableName: invoice
            baseColumnNames: student_id
            referencedTableName: student
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_invoice_cvs
            baseTableName: invoice
            baseColumnNames: cvs_id
            referencedTableName: classroom_version_section
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_invoice_paymentType
            baseTableName: invoice
            baseColumnNames: payment_type_id
            referencedTableName: payment_type
            referencedColumnNames: id