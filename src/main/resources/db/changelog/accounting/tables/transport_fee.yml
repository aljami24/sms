databaseChangeLog:
  - changeSet:
      id: create-transport-fee
      author: afzal
      changes:
        - createTable:
            tableName: transport_fee
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: amount
                  type: DOUBLE
              - column:
                  name: month
                  type: VARCHAR(20)
              - column:
                  name: year_id
                  type: BIGINT
              - column:
                  name: student_id
                  type: BIGINT
              - column:
                  name: cvs_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: updated_at
                  type: DATETIME
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)
