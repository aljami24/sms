databaseChangeLog:
  - changeSet:
      id: create-payment
      author: afzal
      changes:
        - createTable:
            tableName: payment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: invoice_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: payment_method
                  type: VARCHAR(50)

              - column:
                  name: status
                  type: VARCHAR(50)

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_no
                  type: VARCHAR(100)

              - column:
                  name: transaction_date
                  type: TIMESTAMP

              - column:
                  name: remarks
                  type: VARCHAR(255)

              - column:
                  name: gateway_response
                  type: VARCHAR(255)

              - column:
                  name: currency
                  type: VARCHAR(10)

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true

              - column:
                  name: previous_due_amount
                  type: DECIMAL(19,2)

              - column:
                  name: remaining_due_amount
                  type: DECIMAL(19,2)

              # BaseEntity fields
              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_by
                  type: VARCHAR(100)

        # ==========================
        # Foreign Key
        # ==========================

        - addForeignKeyConstraint:
            constraintName: fk_payment_invoice
            baseTableName: payment
            baseColumnNames: invoice_id
            referencedTableName: invoice
            referencedColumnNames: id