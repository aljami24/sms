databaseChangeLog:
  - changeSet:
      id: create-payment
      author: afzal
      changes:
        - createTable:
            tableName: payment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: student_id
                  type: BIGINT
              - column:
                  name: cvs_id
                  type: BIGINT
              - column:
                  name: year_id
                  type: BIGINT
              - column:
                  name: invoice_id
                  type: BIGINT
              - column:
                  name: payment_method
                  type: VARCHAR(50)
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: amount
                  type: DOUBLE
              - column:
                  name: payment_type_id
                  type: BIGINT
              - column:
                  name: transaction_id
                  type: VARCHAR(100)
              - column:
                  name: month
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: updated_at
                  type: DATETIME
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)

        - addForeignKeyConstraint:
            constraintName: fk_payment_year
            baseTableName: payment
            baseColumnNames: year_id
            referencedTableName: year
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_payment_student
            baseTableName: payment
            baseColumnNames: student_id
            referencedTableName: student
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_payment_cvs
            baseTableName: payment
            baseColumnNames: cvs_id
            referencedTableName: classroom_version_section
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_payment_invoice
            baseTableName: payment
            baseColumnNames: invoice_id
            referencedTableName: invoice
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_payment_paymentType
            baseTableName: payment
            baseColumnNames: payment_type_id
            referencedTableName: payment_type
            referencedColumnNames: id