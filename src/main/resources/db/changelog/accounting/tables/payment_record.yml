databaseChangeLog:
  - changeSet:
      id: create-payment-record
      author: afzal
      changes:
        - createTable:
            tableName: payment_record
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: payment_date
                  type: DATE
              - column:
                  name: amount
                  type: DOUBLE
              - column:
                  name: month
                  type: VARCHAR(20)
              - column:
                  name: year_id
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: payment_type_id
                  type: BIGINT
              - column:
                  name: student_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: DATETIME
              - column:
                  name: updated_at
                  type: DATETIME
              - column:
                  name: created_by
                  type: VARCHAR(100)
              - column:
                  name: updated_by
                  type: VARCHAR(100)


        - addForeignKeyConstraint:
            constraintName: fk_payment_record_year
            baseTableName: payment_record
            baseColumnNames: year_id
            referencedTableName: year
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_payment_record_paymentType
            baseTableName: payment_record
            baseColumnNames: payment_type_id
            referencedTableName: payment_type
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_payment_record_student
            baseTableName: payment_record
            baseColumnNames: student_id
            referencedTableName: student
            referencedColumnNames: id
