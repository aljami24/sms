databaseChangeLog:
  - changeSet:
      id: 001-create-division-table
      author: afzal
      comments: Division master table
      changes:
        - createTable:
            tableName: divisions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
