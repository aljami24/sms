databaseChangeLog:
  - changeSet:
      id: 002-create-district-table
      author: afzal
      comments: District table with division relation
      changes:
        - createTable:
            tableName: districts
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: name_bn
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: division_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true

              # BaseEntity ফিল্ডগুলো
              - column:
                  name: created_at
                  type: timestamp

              - column:
                  name: updated_at
                  type: timestamp

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_by
                  type: VARCHAR(100)

        # Foreign key → division
        - addForeignKeyConstraint:
            baseTableName: districts
            baseColumnNames: division_id
            referencedTableName: divisions
            referencedColumnNames: id
            constraintName: fk_district_division
