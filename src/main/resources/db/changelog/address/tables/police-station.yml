databaseChangeLog:
  - changeSet:
      id: 003-create-police-station-table
      author: afzal
      comments: Police station table with district relation
      changes:
        - createTable:
            tableName: police_stations
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: name_bn
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: district_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true

              # BaseEntity ফিল্ডগুলো
              - column:
                  name: created_at
                  type: timestamp

              - column:
                  name: updated_at
                  type: timestamp

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_by
                  type: VARCHAR(100)

        # Foreign key → district
        - addForeignKeyConstraint:
            baseTableName: police_stations
            baseColumnNames: district_id
            referencedTableName: districts
            referencedColumnNames: id
            constraintName: fk_police_station_district
