databaseChangeLog:
  - changeSet:
      id: create-attendance-table
      author: smha
      changes:
        - createTable:
            tableName: attendance
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: month_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: true

              - column:
                  name: marked_by
                  type: BIGINT
                  constraints:
                    nullable: true

              # BaseEntity fields
              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: created_by
                  type: VARCHAR(255)

              - column:
                  name: updated_by
                  type: VARCHAR(255)

        # Foreign Keys
        - addForeignKeyConstraint:
            baseTableName: attendance
            baseColumnNames: student_id
            referencedTableName: student
            referencedColumnNames: id
            constraintName: fk_attendance_student

        - addForeignKeyConstraint:
            baseTableName: attendance
            baseColumnNames: employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_attendance_employee

        - addForeignKeyConstraint:
            baseTableName: attendance
            baseColumnNames: marked_by
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_attendance_marked_by