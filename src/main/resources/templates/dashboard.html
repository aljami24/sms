<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div class="page-bg card mx-2 shadow" layout:fragment="content">

    <!-- ===== Header ===== -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1">Welcome to School Management</h4>
        </div>
        <div class="text-muted small">
            <i class="bi bi-calendar3 me-1"></i>
            Today:
            <span th:text="${#dates.format(#dates.createNow(),'dd MMM yyyy')}"></span>
        </div>
    </div>

    <!-- ===== Summary Cards ===== -->
    <div class="row g-4 mb-4">

        <div class="col-xl-3 col-md-6">
            <a class="text-decoration-none" th:href="@{/student/list}">
                <div class="card  shadow h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3 me-3">
                            <i class="bi bi-people-fill fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Total Students</div>
                            <h4 class="counter" th:text="${allStudent.getTotalElements()}">0</h4>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-xl-3 col-md-6">
            <a class="text-decoration-none" th:href="@{/employee/list}">
                <div class="card  shadow h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="bg-success bg-opacity-10 text-success rounded-circle p-3 me-3">
                            <i class="bi bi-person-badge-fill fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Total Employee</div>
                            <h4 class="counter" th:text="${allEmployee != null ? allEmployee.getTotalElements() : 0}">
                                0</h4>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-xl-3 col-md-6">
            <div class="card  shadow h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-3 me-3">
                        <i class="bi bi-book-fill fs-4"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Active Classes</div>
                        <h4 class="counter" data-count="12">8</h4>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-3 col-md-6">
            <a class="text-decoration-none" th:href="@{/student/all}">
                <div class="card  shadow h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="bg-info bg-opacity-10 text-info rounded-circle p-3 me-3">
                            <i class="bi bi-people-fill fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Absent Students</div>
                            <h4 class="counter" data-count="85000">0</h4>
                        </div>
                    </div>
                </div>
            </a>
        </div>


        <!-- Row 2: Teacher Attendance Summary -->
        <div class="row g-3 mb-4">

            <div class="col-md-6">
                <a class="text-decoration-none" th:href="@{/employee/all}">
                    <div class="card shadow">
                        <div class="card-header bg-success text-white">
                            Employee Attendance
                        </div>

                        <div class="card-body">
                            <div class="row text-center g-3">

                                <!-- Total Employees -->
                                <div class="col-12 col-md-4">
                                    <h6 class="text-muted">Total Employees</h6>
                                    <h3 class="fw-bold">30</h3>
                                </div>

                                <!-- Present -->
                                <div class="col-12 col-md-4">
                                    <h6 class="text-muted">Present</h6>
                                    <h3 class="text-success fw-bold">25</h3>
                                </div>

                                <!-- Absent -->
                                <div class="col-12 col-md-4">
                                    <h6 class="text-muted">Absent</h6>
                                    <h3 class="text-danger fw-bold">5</h3>
                                </div>

                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Row 2: Income/Expense Summary -->
            <div class="col-md-6">
                <a class="text-decoration-none" href="@{/account/accountSummary}">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white">
                            Income / Expense (This Month)
                        </div>

                        <div class="card-body">
                            <div class="row text-center g-3">

                                <!-- Total Income -->
                                <div class="col-12 col-md-4">
                                    <h6 class="text-muted">Total Income</h6>
                                    <h3 class="text-success fw-bold">৳ 500,000</h3>
                                </div>

                                <!-- Total Expense -->
                                <div class="col-12 col-md-4">
                                    <h6 class="text-muted">Total Expense</h6>
                                    <h3 class="text-danger fw-bold">৳ 200,000</h3>
                                </div>

                                <!-- Net Balance -->
                                <div class="col-12 col-md-4">
                                    <h6 class="text-muted">Net Balance</h6>
                                    <h3 class="fw-bold">৳ 300,000</h3>
                                </div>

                            </div>
                        </div>
                    </div>
                </a>
            </div>

        </div>

    </div>


</div>

</body>
</html>
