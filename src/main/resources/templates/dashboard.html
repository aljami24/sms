<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/main}">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div layout:fragment="content" class="page-bg">

    <!-- ===== Header ===== -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1">Welcome to School Management</h4>
        </div>
        <div class="text-muted small">
            <i class="bi bi-calendar3 me-1"></i>
            Today:
            <span th:text="${#dates.format(#dates.createNow(),'dd MMM yyyy')}"></span>
        </div>
    </div>

    <!-- ===== Summary Cards ===== -->
    <div class="row g-4 mb-4">

        <div class="col-xl-3 col-md-6">
            <a th:href="@{/student/all}" class="text-decoration-none">
                <div class="card dashboard-card shadow h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3 me-3">
                            <i class="bi bi-people-fill fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Total Students</div>
                            <h4 class="counter" th:text="${allStudent.size()}">0</h4>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-xl-3 col-md-6">
            <a th:href="@{/employee/all}" class="text-decoration-none">
                <div class="card dashboard-card shadow h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="bg-success bg-opacity-10 text-success rounded-circle p-3 me-3">
                            <i class="bi bi-person-badge-fill fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Total Employee</div>
                            <h4 class="counter" th:text="${allEmployee != null ? allEmployee.getTotalElements() : 0}">0</h4>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-xl-3 col-md-6">
            <div class="card dashboard-card shadow h-100">
                <div class="card-body d-flex align-items-center">
                    <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-3 me-3">
                        <i class="bi bi-book-fill fs-4"></i>
                    </div>
                    <div>
                        <div class="text-muted small">Active Classes</div>
                        <h4 class="counter" data-count="12">0</h4>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-3 col-md-6">
            <a th:href="@{/student/all}" class="text-decoration-none">
                <div class="card dashboard-card shadow h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="bg-info bg-opacity-10 text-info rounded-circle p-3 me-3">
                            <i class="bi bi-people-fill fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Absent Students</div>
                            <h4 class="counter" data-count="85000">0</h4>
                        </div>
                    </div>
                </div>
            </a>
        </div>


        <!-- Row 2: Teacher Attendance Summary -->
        <div class="row g-3 mb-4">

            <div class="col-md-6">
                <a th:href="@{/employee/all}" class="text-decoration-none">
                    <div class="card dashboard-card shadow">
                        <div class="card-header bg-success text-white">
                            Employee Attendance (This Month)
                        </div>
                        <div class="card-body">
                            <table class="table table-striped table-hover mb-0">
                                <thead>
                                <tr>
                                    <th>Teacher</th>
                                    <th>Present</th>
                                    <th>Absent</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr >
                                    <td >Abdullah </td>
                                    <td >28</td>
                                    <td >2</td>
                                </tr>
                                <tr >
                                    <td >Masum Billah </td>
                                    <td >25</td>
                                    <td >5</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </a>
            </div>

            <!-- Row 2: Income/Expense Summary -->
            <div class="col-md-6">
                <a th:href="@{/account/accountSummary}" class="text-decoration-none">
                    <div class="card dashboard-card  shadow">
                        <div class="card-header text-light bg-primary">
                            Income / Expense (This Month)
                        </div>
                        <div class="card-body">
                            <table class="table table-bordered mb-0">
                                <tbody>
                                <tr>
                                    <th>Total Income</th>
                                    <td>৳ 500,000</td>
                                </tr>
                                <tr>
                                    <th>Total Expense</th>
                                    <td >৳ 200,000</td>
                                </tr>
                                <tr>
                                    <th>Net Balance</th>
                                    <td >৳ 300,000</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </a>
            </div>

        </div>

    </div>


</div>

</body>
</html>
