<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div layout:fragment="content" class="container py-4 card page-bg shadow mx-2">

    <h3 th:text="${role.id != null} ? 'Edit Role' : 'Create Role'"></h3>

    <form th:action="@{/role/save}" th:object="${role}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Role Name</label>
            <input type="text" class="form-control" th:field="*{name}" placeholder="Role Name" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Permissions</label>
            <div class="row">
                <div class="col-md-3" th:each="p : ${permissions}">
                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               name="permissionIds"
                               th:value="${p.id}"
                               th:checked="${role.permissions != null and role.permissions.contains(p)}"
                               th:id="${'perm' + p.id}">
                        <label class="form-check-label" th:for="${'perm' + p.id}" th:text="${p.code}"></label>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a th:href="@{/role/list}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>

</div>

</body>
</html>
