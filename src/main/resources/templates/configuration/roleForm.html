<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div class="page-bg card mx-2 shadow" layout:fragment="content">

    <h3 th:text="${role.id != null} ? 'Edit Role' : 'Create Role'"></h3>

    <form method="post" th:action="@{/role/save}" th:object="${role}">
        <input th:field="*{id}" type="hidden">

        <div class="mb-3">
            <label class="form-label">Role Name</label>
            <input class="form-control" placeholder="Role Name" required th:field="*{name}" type="text">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Permissions</label>
            <div class="row">
                <div class="col-md-3" th:each="p : ${permissions}">
                    <div class="form-check">
                        <input class="form-check-input"
                               name="permissionIds"
                               th:checked="${role.permissions != null and role.permissions.contains(p)}"
                               th:id="${'perm' + p.id}"
                               th:value="${p.id}"
                               type="checkbox">
                        <label class="form-check-label" th:for="${'perm' + p.id}" th:text="${p.code}"></label>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button class="btn btn-primary" type="submit">Save Changes</button>
            <a class="btn btn-secondary" th:href="@{/role/list}">Cancel</a>
        </div>
    </form>

</div>

</body>
</html>
