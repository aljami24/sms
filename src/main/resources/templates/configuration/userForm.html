<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div layout:fragment="content" class="container py-4 card page-bg shadow mx-2">

    <h3 th:text="${userDto.id == null} ? 'Create User' : 'Edit User'" class="mb-4"></h3>

    <form th:object="${userDto}" method="post"
          th:action="@{${userDto.id == null ? '/user/save' : '/user/update/' + userDto.id}}">

        <!-- Username -->
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" th:field="*{username}" class="form-control" placeholder="Enter username" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="Enter password">
            <div class="form-text">Leave blank to keep old password.</div>
        </div>

        <!-- Roles -->
        <div class="mb-3">
            <label class="form-label fw-bold">Roles</label>
            <div class="d-flex flex-wrap gap-2">
                <div th:each="role : ${roles}" class="form-check">
                    <input class="form-check-input" type="checkbox"
                           th:value="${role.id}" th:field="*{roleIds}"
                           th:id="'role_' + ${role.id}">
                    <label class="form-check-label" th:for="'role_' + ${role.id}" th:text="${role.name}"></label>
                </div>
            </div>
        </div>

        <!-- Permissions -->
        <div class="mb-3">
            <label class="form-label fw-bold">Permissions</label>
            <div class="d-flex flex-wrap gap-2">
                <div th:each="p : ${permissions}" class="form-check">
                    <input class="form-check-input" type="checkbox"
                           th:value="${p.id}" th:field="*{permissionIds}"
                           th:id="'perm_' + ${p.id}">
                    <label class="form-check-label" th:for="'perm_' + ${p.id}" th:text="${p.code}"></label>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/templates/configuration/list}" class="btn btn-secondary ms-2">Cancel</a>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
