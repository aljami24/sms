<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="page-bg card mx-2 shadow" layout:fragment="content">

    <h5 class="fw-bold mb-3" th:text="${userDto.id == null} ? 'Create User' : 'Edit User'"></h5>

    <form method="post" th:action="@{${userDto.id == null ? '/user/save' : '/user/update/' + userDto.id}}"
          th:object="${userDto}">

        <!-- Username -->
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" placeholder="Enter username" required th:field="*{username}" type="text">
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" placeholder="Enter password" th:field="*{password}" type="password">
            <div class="form-text">Leave blank to keep old password.</div>
        </div>

        <!-- Roles -->
        <div class="mb-3">
            <label class="form-label fw-bold">Roles</label>
            <div class="d-flex flex-wrap gap-2">
                <div class="form-check" th:each="role : ${roles}">
                    <input class="form-check-input role-checkbox" th:checked="${userDto.roleIds.contains(role.id)}"
                           th:field="*{roleIds}" th:id="'role_' + ${role.id}" th:value="${role.id}"
                           type="checkbox">
                    <label class="form-check-label" th:for="'role_' + ${role.id}" th:text="${role.name}"></label>
                </div>
            </div>
        </div>

        <!-- Permissions -->
        <div class="mb-3">
            <label class="form-label fw-bold ">
                Permissions
                <div class="py-1">
                    <input class="form-check-input me-1" id="selectAllPerms" type="checkbox">
                    <label class="form-check-label mb-0" for="selectAllPerms">Select All</label>
                </div>
            </label>
            <div class="d-flex flex-wrap gap-2" id="permissionsDiv">
                <div class="form-check perm-item" style="display:none" th:each="p : ${permissions}">
                    <input class="form-check-input perm-checkbox" th:checked="${userDto.permissionIds.contains(p.id)}"
                           th:field="*{permissionIds}" th:id="'perm_' + ${p.id}" th:value="${p.id}"
                           type="checkbox">
                    <label class="form-check-label" th:for="'perm_' + ${p.id}" th:text="${p.code}"></label>
                </div>
            </div>
        </div>

        <button class="btn" id="btn" type="submit">Save</button>
        <a class="btn btn-secondary ms-2" th:href="@{/user/list}">Cancel</a>
    </form>

    <script th:inline="javascript">

        const rolePermMap = /*[[${rolePermMap}]]*/ {};

        const roleCheckboxes = document.querySelectorAll(".role-checkbox");
        const permCheckboxes = document.querySelectorAll(".perm-checkbox");
        const permItems = document.querySelectorAll(".perm-item");
        const selectAll = document.getElementById("selectAllPerms");

        function updatePermissions() {
            permItems.forEach(item => item.style.display = 'none');

            const selectedRoleIds = Array.from(roleCheckboxes)
                .filter(r => r.checked)
                .map(r => r.value.toString());

            const permsToShow = new Set();

            selectedRoleIds.forEach(rId => {
                if (rolePermMap && rolePermMap[rId]) {
                    rolePermMap[rId].forEach(pid => permsToShow.add(pid.toString()));
                }
            });

            permCheckboxes.forEach(pcb => {
                const val = pcb.value.toString();
                if (permsToShow.has(val)) {
                    pcb.closest('div.perm-item').style.display = 'block';
                } else {
                    pcb.checked = false;
                }
            });

            updateSelectAllState();
        }

        roleCheckboxes.forEach(cb => cb.addEventListener('change', updatePermissions));

        if (selectAll) {
            selectAll.addEventListener('change', function () {
                const visiblePerms = Array.from(permCheckboxes).filter(pcb => pcb.closest('div.perm-item').style.display !== 'none');
                visiblePerms.forEach(pcb => pcb.checked = this.checked);
            });
        }

        function updateSelectAllState() {
            if (!selectAll) return;
            const visiblePerms = Array.from(permCheckboxes).filter(pcb => pcb.closest('div.perm-item').style.display !== 'none');
            const allChecked = visiblePerms.length > 0 && visiblePerms.every(pcb => pcb.checked);
            selectAll.checked = allChecked;
        }

        permCheckboxes.forEach(pcb => {
            pcb.addEventListener('change', updateSelectAllState);
        });

        // Initial load
        document.addEventListener("DOMContentLoaded", function () {
            updatePermissions();
        });
        /*]]>*/
    </script>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
