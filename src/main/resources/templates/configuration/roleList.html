<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
  <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div layout:fragment="content" class="container py-4 card page-bg shadow mx-2">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Role List</h4>
    <a th:href="@{/role/form}" class="btn btn-primary">➕ Add Role</a>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-success">
    <tr>
      <th>Role</th>
      <th>Permissions (Code)</th>
      <th>Permissions (Description)</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="role : ${roles}">
      <td th:text="${role.name}"></td>
      <td>
        <span th:each="p : ${role.permissions}" th:text="${p.code + ', '}"></span>
      </td>
      <td>
        <span th:each="p : ${role.permissions}" th:text="${p.description + ', '}"></span>
      </td>
      <td>
        <a th:href="@{/role/form(id=${role.id})}" class="btn btn-sm btn-warning">✏ Edit</a>
        <form th:id="'deleteRoleForm-' + ${role.id}"
              th:action="@{/role/delete/{id}(id=${role.id})}"
              method="post"
              style="display:inline;">

          <button type="button"
                  class="btn btn-sm btn-danger"
                  th:onclick="'confirmDelete(\'deleteRoleForm-' + ${role.id} + '\')'">
            🗑 Delete
          </button>

        </form>

      </td>
    </tr>
    </tbody>
  </table>

  <script>
    function confirmDelete(formId) {
      Swal.fire({
        title: 'Are you sure?',
        text: "You won't be able to revert this!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Yes, delete it!'
      }).then((result) => {
        if (result.isConfirmed) {
          document.getElementById(formId).submit();
        }
      });
    }
  </script>

</div>


</body>
</html>
