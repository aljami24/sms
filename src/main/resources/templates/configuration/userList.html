<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div class="page-bg card mx-2 shadow" layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">User List</h5>
        <a class="btn" id="btn" th:href="@{/user/form}">Add User</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-success">
        <tr>
            <th style="width: 25%">Username</th>
            <th style="width: 25%">Roles</th>
            <th style="width: 35%">Permissions</th>
            <th class="text-center" style="width: 15%">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.username}"></td>
            <td>
                <span th:each="r : ${user.roles}" th:text="${r.name + ' '}"></span>
            </td>
            <td>
                <span th:each="p : ${user.permissions}" th:text="${p.code + ' '}"></span>
            </td>
            <td class="text-end">
                <a class="btn action-edit mb-2" th:href="@{/user/edit/{id}(id=${user.id})}">Edit</a><br>
                <form method="post"
                      style="display:inline;"
                      th:action="@{/user/delete/{id}(id=${user.id})}"
                      th:id="'deleteUserForm-' + ${user.id}">

                    <button class="btn action-delete"
                            th:onclick="'confirmDelete(\'deleteUserForm-' + ${user.id} + '\')'"
                            type="button">
                         Delete
                    </button>

                </form>

            </td>
        </tr>
        </tbody>
    </table>

    <script>
        function confirmDelete(formId) {
            Swal.fire({
                title: 'Are you sure?',
                text: "You won't be able to revert this!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById(formId).submit();
                }
            });
        }
    </script>

</div>

</body>
</html>
