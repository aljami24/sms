<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div class="page-bg" layout:fragment="content">

    <!-- ===== Page Header + Actions ===== -->
    <div class="d-flex justify-content-between align-items-center mb-3">

        <!-- Left : Title -->
        <h4 class="fw-bold mb-0">
            <i class="bi bi-people-fill me-2"></i> Students List
        </h4>

        <!-- Right : Actions -->
        <div class="d-flex align-items-center gap-2">

            <!-- New Admission -->
            <a th:href="@{/student/create}" sec:authorize="hasAnyRole('ADMIN', 'REGISTER_ADMIN')" class="btn btn-primary">
                <i class="bi bi-clock-history me-1"></i> New Admission
            </a>

            <!-- Old Admission Button -->
            <button class="btn btn-secondary" sec:authorize="hasAnyRole('ADMIN', 'REGISTER_ADMIN')"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#OldAdmissionBox"
                    aria-expanded="false">
                <i class="bi bi-plus-circle me-1"></i> Old Admission
            </button>

            <!-- Inline Old Admission Search -->
            <div class="collapse" id="OldAdmissionBox">
                <form method="get"
                      th:action="@{/student/Old-admission}"
                      class="d-flex align-items-center gap-1 ms-2">

                    <input type="text"
                           name="roll"
                           class="form-control form-control-sm text-end"
                           placeholder="Student Roll"
                           style="width: 120px;"
                           required>

                    <button class="btn btn-success btn-sm">
                        <i class="bi bi-search"></i>
                    </button>

                </form>
            </div>

        </div>
    </div>

    <!-- ===== Filter Section ===== -->
    <div class="card filter-card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/student/list}">
                <div class="row g-3">

                    <div class="col-md-2">
                        <input class="form-control" name="rollNumber" placeholder="Student Roll"
                               type="text"
                               th:value="${rollNumber}">
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="className">
                            <option value="">Class</option>
                            <option th:each="classRoom : ${classRoom}"
                                    th:value="${classRoom.id}"
                                    th:text="${classRoom.name}"
                                    th:selected="${className != null && className == classRoom.id}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="section">
                            <option value="">Section</option>
                            <option value="A" th:selected="${section == 'A'}">A</option>
                            <option value="B" th:selected="${section == 'B'}">B</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="version">
                            <option value="">Version</option>
                            <option value="Bangla" th:selected="${version == 'Bangla'}">Bangla</option>
                            <option value="English" th:selected="${version == 'English'}">English</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <div class="d-grid gap-2 d-md-flex">
                            <button class="btn btn-success flex-grow-1">
                                <i class="bi bi-search me-1"></i> Search
                            </button>
                            <a th:href="@{/student/list}" class="btn btn-outline-secondary flex-grow-1">
                                <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
                            </a>
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!-- ===== Table Section ===== -->
    <div class="card table-card shadow-sm border-0">
        <div class="card-body p-0">

            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-secondary">
                    <tr>
                        <th style="width: 5%;" class="text-center">Sl</th>
                        <th style="width: 35%;" class="text-start">Student Details</th>
                        <th style="width: 20%;" class="text-start">Academic Info</th>
                        <th style="width: 40%;" class="text-start">Address</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="student,stat : ${getStudentAll}">
                        <!-- Serial Number with pagination -->
                        <td class="text-center" th:text="${currentPage * pageSize + stat.count}"></td>
                        <td>
                            <span><strong>Roll :</strong> <span th:text="${student.roll}"></span></span><br>
                            <span><strong>Name :</strong> <a class="text-decoration-none link-success link-underline-opacity-0 link-underline-opacity-100-hover"
                                                             th:href="@{'/student/details/'+${student.id}}" title="View">
                                <span th:text="${student.name}"></span></a>
                            </span><br>
                            <span><strong>Father :</strong> <span th:text="${student.fatherName}"></span></span><br>
                            <span><strong>Mother :</strong> <span th:text="${student.motherName}"></span></span><br>
                        </td>
                        <td>
    <span>
        <strong>Class :</strong>
        <span th:text="${student.classroomVersionSectionsId != null ? student.classroomVersionSectionsId.classRoom.name : 'N/A'}"></span>
    </span><br>

                            <span>
        <strong>Version :</strong>
        <span th:text="${student.classroomVersionSectionsId != null ? student.classroomVersionSectionsId.version.name : 'N/A'}"></span>
    </span><br>

                            <span>
        <strong>Section :</strong>
        <span th:text="${student.classroomVersionSectionsId?.section?.name ?: 'N/A'}"></span>
    </span><br>
                        </td>

                        <td>
                            <ul>
                                <li th:each="addr : ${student.addresses}">
                                    <span class="fw-bold" th:text="${addr.addressType} + ' :  ' "></span>
                                    <span th:text="${addr.village} + ', ' + ${addr.policeStation?.name} + ', ' + ${addr.district?.name} + ', ' + ${addr.division?.name}"></span>

                                </li>
                            </ul>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- ===== Pagination ===== -->
    <nav aria-label="Page navigation example " class="mt-2">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/student/list(page=${currentPage - 1}, rollNumber=${rollNumber}, className=${className}, section=${section}, version=${version})}">Previous</a>
            </li>
            <li class="page-item" th:classappend="${i == currentPage} ? 'active' : ''"
                th:each=" i : ${#numbers.sequence(0,totalPages -1)}">
                <a class="page-link" th:href="@{/student/list(page=${i}, rollNumber=${rollNumber}, className=${className}, section=${section}, version=${version})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/student/list(page=${currentPage + 1}, rollNumber=${rollNumber}, className=${className}, section=${section}, version=${version})}">Next</a>
            </li>
        </ul>
    </nav>

</div>

</body>
</html>
