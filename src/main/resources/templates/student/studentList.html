<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div class="page-bg" layout:fragment="content">

    <!-- ===== Page Header ===== -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">
            <i class="bi bi-people-fill me-2"></i> Students List
        </h4>
    </div>

    <!-- ===== Filter Section ===== -->
    <div class="card filter-card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form action="" method="get">
                <div class="row g-3">

                    <div class="col-md-2">
                        <input class="form-control" name="name" placeholder="Student Roll"
                               type="text"
                               value="">
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="className">
                            <option value="">Class</option>
                            <option
                                    value="">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="section">
                            <option value="">Section</option>
                            <option>A</option>
                            <option>B</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="version">
                            <option value="">Version</option>
                            <option>Bangla</option>
                            <option>English</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <input class="form-control" name="rollOrReg"
                               placeholder="Roll / Reg"
                               type="text"
                               value="">
                    </div>

                    <div class="col-md-2 d-grid">
                        <button class="btn btn-success">
                            <i class="bi bi-search me-1"></i> Search
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!-- ===== Table Section ===== -->
    <div class="card table-card shadow-sm border-0">
        <div class="card-body p-0">

            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-secondary">
                    <tr>
                        <th class="text-center">sl</th>
                        <th class="text-center">Student</th>
                        <th class="text-center">Academic</th>
                        <th class="text-center">Address</th>
                        <th class="text-center">Action</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="student,stat : ${getStudentAll}">
                        <!-- Serial Number with pagination -->
                        <td class="text-center" th:text="${stat.count}"></td>
                        <td>
                            <span><strong>Roll :</strong> <span text="${student.roll}"></span></span><br>
                            <span><strong>Name :</strong> <span th:text="${student.name}"></span></span><br>
                            <span><strong>Father :</strong> <span th:text="${student.fatherName}"></span></span><br>
                            <span><strong>Mother :</strong> <span th:text="${student.motherName}"></span></span><br>
                        </td>
                        <td>
                            <span><strong>Class :</strong> <span text="${student.roll}">1</span></span><br>
                            <span><strong>Version :</strong> <span text="${student.name}">Bangla</span></span><br>
                            <span><strong>Section :</strong> <span text="${student.name}">A</span></span><br>
                        </td>
                        <td>
                            <ul>
                                <li th:each="addr : ${student.addresses}">
                                    <span class="fw-bold" th:text="${addr.addressType} + ' :  ' "></span>
                                    <span th:text="${addr.village + ', ' + addr.policeStation + ', ' + addr.district + ', ' + addr.division}"></span>

                                </li>
                            </ul>
                        </td>

                        <!-- Actions -->
                        <td class="text-center">

                            <!-- View -->
                            <a class="action-btn view" href="@{'/student/detail/'+${student.id}}" title="View">
                                <i class="bi bi-eye-fill"></i>
                            </a>

                            <!-- Edit -->
                            <a class="action-btn edit" href="@{'/student/edit/'+${student.id}}" title="Edit">
                                <i class="bi bi-pencil-square"></i>
                            </a>

                            <!-- Delete Button -->
                            <button class="action-btn delete"
                                    data-bs-target="'#deleteModal_' + ${student.id}"
                                    data-bs-toggle="modal"
                                    type="button">
                                <i class="bi bi-trash-fill"></i>
                            </button>

                            <!-- Delete Modal -->
                            <div class="modal fade"
                                 id="'deleteModal_' + ${student.id}"
                                 tabindex="-1">

                                <div class="modal-dialog modal-dialog-centered">
                                    <div class="modal-content">

                                        <div class="modal-header">
                                            <h5 class="modal-title text-danger">
                                                Confirm Delete
                                            </h5>
                                            <button class="btn-close"
                                                    data-bs-dismiss="modal"
                                                    type="button"></button>
                                        </div>

                                        <div class="modal-body">
                                            Are you sure you want to delete
                                            <strong text="${student.name}"></strong> ?
                                        </div>

                                        <div class="modal-footer">
                                            <button class="btn btn-secondary"
                                                    data-bs-dismiss="modal"
                                                    type="button">
                                                Cancel
                                            </button>

                                            <form action="@{/student/delete/{id}(id=${student.id})}"
                                                  method="post">
                                                <button class="btn btn-danger">
                                                    <i class="bi bi-trash me-1"></i> Delete
                                                </button>
                                            </form>
                                        </div>

                                    </div>
                                </div>
                            </div>

                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- ===== Pagination ===== -->
    <nav aria-label="Page navigation example">
        <ul class="pagination justify-content-center">
            <li class="page-item" classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" href="@{/student/all(page = ${currentPage - 1})}">Previous</a>
            </li>
            <li class="page-item" classappend="${i == currentPage} ? 'active' : ''"
                each=" i : ${#numbers.sequence(0,totalPages -1)}">
                <a class="page-link" href="@{/student/all(page = ${i})}" text="${i + 1}">1</a>
            </li>
            <li class="page-item" classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" href="@{/student/all(page = ${currentPage + 1})}">Next</a>
            </li>
        </ul>
    </nav>

</div>

</body>
</html>
