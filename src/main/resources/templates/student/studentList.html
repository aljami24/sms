<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div class="page-bg card mx-2 shadow" layout:fragment="content">

    <!-- ===== Page Header + Actions ===== -->
    <div class="d-flex justify-content-between align-items-center mb-3">

        <!-- Left : Title -->
        <h4 class="fw-bold mb-0">
            <i class="bi bi-people-fill me-2"></i> Students List
        </h4>

        <!-- Right : Actions -->
        <div class="d-flex align-items-center gap-2">

            <!-- New Admission -->
            <a class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN', 'REGISTER_ADMIN')"
               th:href="@{/student/create}">
                <i class="bi bi-clock-history me-1"></i> New Admission
            </a>

            <!-- Old Admission Button -->
            <button aria-expanded="false" class="btn btn-secondary"
                    data-bs-target="#OldAdmissionBox"
                    data-bs-toggle="collapse"
                    sec:authorize="hasAnyRole('ADMIN', 'REGISTER_ADMIN')"
                    type="button">
                <i class="bi bi-plus-circle me-1"></i> Old Admission
            </button>

            <!-- Inline Old Admission Search -->
            <div class="collapse" id="OldAdmissionBox">
                <form class="d-flex align-items-center gap-1 ms-2"
                      method="get"
                      th:action="@{/student/old-admission}">

                    <input class="form-control form-control-sm text-end"
                           name="registration"
                           placeholder="Registration No"
                           required
                           style="width: 150px;"
                           type="text">

                    <button class="btn btn-success btn-sm">
                        <i class="bi bi-search"></i>
                    </button>

                </form>
            </div>

        </div>
    </div>

    <!-- ===== Filter Section ===== -->
    <div class="card filter-card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/student/list}">
                <div class="row g-3">

                    <div class="col-md-2">
                        <div class="position-relative">
                            <input class="form-control" name="rollNumber" oninput="toggleClearIcon(this)"
                                   placeholder="Roll"
                                   th:value="${rollNumber}"
                                   type="text">
                            <span class="position-absolute top-50 end-0 translate-middle-y me-3 d-none"
                                  onclick="clearInput(this)"
                                  style="cursor:pointer">
                                        <i class="bi bi-x-circle-fill"></i>
                                    </span>
                        </div>
                    </div>

                    <div class="col-md-2">
                        <div class="position-relative">
                            <input class="form-control" name="registrationNumber" oninput="toggleClearIcon(this)"
                                   placeholder="Registration"
                                   th:value="${registrationNumber}"
                                   type="text">
                            <span class="position-absolute top-50 end-0 translate-middle-y me-3 d-none"
                                  onclick="clearInput(this)"
                                  style="cursor:pointer">
                                        <i class="bi bi-x-circle-fill"></i>
                                    </span>
                        </div>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="className">
                            <option value="">Class</option>
                            <option th:each="classRoom : ${classRoom}"
                                    th:selected="${className != null && className == classRoom.id}"
                                    th:text="${classRoom.name}"
                                    th:value="${classRoom.id}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="section">
                            <option value="">Section</option>
                            <option th:selected="${section == 'A'}" value="A">A</option>
                            <option th:selected="${section == 'B'}" value="B">B</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="version">
                            <option value="">Version</option>
                            <option th:selected="${version == 'Bangla'}" value="Bangla">Bangla</option>
                            <option th:selected="${version == 'English'}" value="English">English</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="yearId">
                            <option value="">Year</option>
                            <option th:each="y : ${years}"
                                    th:selected="${yearId != null && yearId == y.id}"
                                    th:text="${y.name}"
                                    th:value="${y.id}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <div class="d-grid gap-2 d-md-flex">
                            <button class="btn btn-success flex-grow-1">
                                <i class="bi bi-search me-1"></i> Search
                            </button>
                            <a class="btn btn-outline-secondary flex-grow-1" th:href="@{/student/list}">
                                <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
                            </a>
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!-- ===== Table Section ===== -->
    <div class="card table-card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="d-flex justify-content-between align-items-center mt-3">
                <strong>Total : <span th:text="${getStudentAll.totalElements}"></span></strong>
                <strong><span th:text="'Page ' + ${currentPage + 1} + ' of ' + ${totalPages}"></span></strong>
            </div>

            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-secondary">
                    <tr>
                        <th class="text-center" style="width: 5%;">Sl</th>
                        <th class="text-start" style="width: 35%;">Student Details</th>
                        <th class="text-start" style="width: 20%;">Academic Info</th>
                        <th class="text-start" style="width: 40%;">Address</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="student,stat : ${getStudentAll}">
                        <!-- Serial Number with pagination -->
                        <td class="text-center" th:text="${currentPage * pageSize + stat.count}"></td>
                        <td>
                            <span><strong>Roll :</strong> <span th:text="${student.roll}"></span></span><br>
                            <span><strong>Registration :</strong> <span th:text="${student.registration}"></span></span><br>
                            <span><strong>Name :</strong> <a
                                    class="text-decoration-none link-success link-underline-opacity-0 link-underline-opacity-100-hover"
                                    th:href="@{'/student/details/'+${student.id}}" title="View">
                                <span th:text="${student.name}"></span></a>
                            </span><br>
                            <span><strong>Father :</strong> <span th:text="${student.fatherName}"></span></span><br>
                            <span><strong>Mother :</strong> <span th:text="${student.motherName}"></span></span><br>
                        </td>
                        <td>
    <span>
        <strong>Class :</strong>
        <span th:text="${student.classRoomName != null ? student.classRoomName : 'N/A'}"></span>
    </span><br>

                            <span>
        <strong>Version :</strong>
        <span th:text="${student.versionName != null ? student.versionName : 'N/A'}"></span>
    </span><br>

                            <span>
        <strong>Section :</strong>
        <span th:text="${student.sectionName != null ? student.sectionName : 'N/A'}"></span>
    </span><br>

                            <span>
        <strong>Year :</strong>
        <span th:text="${student.yearName != null ? student.yearName : 'N/A'}"></span>
    </span><br>
                        </td>

                        <td>
                            <ul>
                                <li th:each="addr : ${student.addresses}">
                                    <span class="fw-bold" th:text="${addr.addressType} + ' :  ' "></span>
                                    <span th:text="${addr.village} + ', ' + ${addr.policeStation?.name} + ', ' + ${addr.district?.name} + ', ' + ${addr.division?.name}"></span>

                                </li>
                            </ul>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- ===== Pagination ===== -->
    <nav aria-label="Page navigation example " class="mt-2">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/student/list(page=${currentPage - 1}, rollNumber=${rollNumber}, registrationNumber=${registrationNumber}, className=${className}, section=${section}, version=${version}, yearId=${yearId})}">Previous</a>
            </li>
            <li class="page-item" th:classappend="${i == currentPage} ? 'active' : ''"
                th:each=" i : ${#numbers.sequence(0,totalPages -1)}">
                <a class="page-link"
                   th:href="@{/student/list(page=${i}, rollNumber=${rollNumber}, registrationNumber=${registrationNumber}, className=${className}, section=${section}, version=${version}, yearId=${yearId})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/student/list(page=${currentPage + 1}, rollNumber=${rollNumber}, registrationNumber=${registrationNumber}, className=${className}, section=${section}, version=${version}, yearId=${yearId})}">Next</a>
            </li>
        </ul>
    </nav>

    <script>
        function toggleClearIcon(input) {
            const icon = input.nextElementSibling;
            if (input.value.trim() !== '') {
                icon.classList.remove('d-none');
            } else {
                icon.classList.add('d-none');
            }
        }

        function clearInput(icon) {
            const input = icon.previousElementSibling;
            input.value = '';
            icon.classList.add('d-none');
            input.focus();
        }
    </script>

</div>

</body>
</html>
