<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div class="page-bg" layout:fragment="content">

    <!-- ===== Page Header ===== -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">
            <i class="bi bi-people-fill me-2"></i> Students List
        </h4>
    </div>

    <!-- ===== Filter Section ===== -->
    <div class="card filter-card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form method="get" th:action="@{student/roll}">
                <div class="row g-3">

                    <div class="col-md-2">
                        <input class="form-control" name="rollNumber" placeholder="Student Roll"
                               type="text"
                               value="">
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="className">
                            <option value="">Class</option>
                            <option
                                    value="">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="section">
                            <option value="">Section</option>
                            <option>A</option>
                            <option>B</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <select class="form-select" name="version">
                            <option value="">Version</option>
                            <option>Bangla</option>
                            <option>English</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <input class="form-control" name="rollOrReg"
                               placeholder="Roll / Reg"
                               type="text"
                               value="">
                    </div>

                    <div class="col-md-2 d-grid">
                        <button class="btn btn-success">
                            <i class="bi bi-search me-1"></i> Search
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!-- ===== Table Section ===== -->
    <div class="card table-card shadow-sm border-0">
        <div class="card-body p-0">

            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-secondary">
                    <tr>
                        <th style="width: 5%;" class="text-center">Sl</th>
                        <th style="width: 35%;" class="text-start">Student Details</th>
                        <th style="width: 20%;" class="text-start">Academic Info</th>
                        <th style="width: 40%;" class="text-start">Address</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="student,stat : ${getStudentAll}">
                        <!-- Serial Number with pagination -->
                        <td class="text-center" th:text="${stat.count}"></td>
                        <td>
                            <span><strong>Roll :</strong> <span th:text="${student.roll}"></span></span><br>
                            <span><strong>Name :</strong> <a class="text-decoration-none link-success link-underline-opacity-0 link-underline-opacity-100-hover"
                                                             th:href="@{'/student/details/'+${student.id}}" title="View">
                                <span th:text="${student.name}"></span></a>
                            </span><br>
                            <span><strong>Father :</strong> <span th:text="${student.fatherName}"></span></span><br>
                            <span><strong>Mother :</strong> <span th:text="${student.motherName}"></span></span><br>
                        </td>
                        <td>
    <span>
        <strong>Class :</strong>
        <span th:text="${student.classroomVersionSectionsId != null ? student.classroomVersionSectionsId.classRoom.name : 'N/A'}"></span>
    </span><br>

                            <span>
        <strong>Version :</strong>
        <span th:text="${student.classroomVersionSectionsId != null ? student.classroomVersionSectionsId.version.name : 'N/A'}"></span>
    </span><br>

                            <span>
        <strong>Section :</strong>
        <span th:text="${student.classroomVersionSectionsId?.section?.name ?: 'N/A'}"></span>
    </span><br>
                        </td>

                        <td>
                            <ul>
                                <li th:each="addr : ${student.addresses}">
                                    <span class="fw-bold" th:text="${addr.addressType} + ' :  ' "></span>
                                    <span th:text="${addr.village} + ', ' + ${addr.policeStation?.name} + ', ' + ${addr.district?.name} + ', ' + ${addr.division?.name}"></span>

                                </li>
                            </ul>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- ===== Pagination ===== -->
    <nav aria-label="Page navigation example " class="mt-2">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/student/list(page = ${currentPage - 1})}">Previous</a>
            </li>
            <li class="page-item" th:classappend="${i == currentPage} ? 'active' : ''"
                th:each=" i : ${#numbers.sequence(0,totalPages -1)}">
                <a class="page-link" th:href="@{/student/list(page = ${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/student/list(page = ${currentPage + 1})}">Next</a>
            </li>
        </ul>
    </nav>

</div>

</body>
</html>
