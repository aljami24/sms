<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div class="container py-4" layout:fragment="content">

    <!-- ===== Profile Header ===== -->
    <div class="card shadow mb-5">

        <div class="card-body">
            <div class="row">

                <!-- Avatar -->
                <div class="col-md-3 justify-md-center ms-4"
                     style="bottom:-65px;">
                    <img alt="Student's Photo"
                         class="img-fluid rounded-circle border border-5 border-light shadow"
                         style="width: 150px; height: 150px; object-fit: cover;"
                         th:src="@{'/UploadFile' + ${showStudentDetail.photoDir}}">
                </div>

                <!-- Name -->
                <div class="col-md-4 pt-4">
                    <h4 class="fw-bold text-dark mb-1"
                        th:text="${showStudentDetail.name}">
                        Student Name
                    </h4>
                    <span class="badge bg-light text-dark">
                    Registration No:
                    <span th:text="${showStudentDetail.roll}"></span>
                </span>
                </div>

            </div>

        </div>
    </div>

    <!-- ===== Info Section ===== -->
    <div class="row g-4">

        <!-- Student Info -->
        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body">
                    <h6 class="fw-semibold text-secondary mb-3">
                        Student Information
                    </h6>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Date of Birth</span>
                        <strong th:text="${showStudentDetail.dob}"></strong>
                    </div>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Gender</span>
                        <strong th:text="${showStudentDetail.gender}"></strong>
                    </div>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Father Name</span>
                        <strong th:text="${showStudentDetail.fatherName}"></strong>
                    </div>

                    <div class="d-flex justify-content-between pt-2 small">
                        <span>Mother Name</span>
                        <strong th:text="${showStudentDetail.motherName}"></strong>
                    </div>
                </div>
            </div>
        </div>

        <!-- Address Info -->
        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body">
                    <h6 class="fw-semibold text-secondary mb-3">
                        Address Information
                    </h6>
                    <ul>
                        <li th:each="addr : ${showStudentDetail.addresses}">
                            <span class="fw-bold" th:text="${addr.addressType} + ' :  ' "></span>
                            <span th:text="${addr.village} + ', ' + ${addr.policeStation?.name} + ', ' + ${addr.district?.name} + ', ' + ${addr.division?.name}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Academic Info -->
        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body">
                    <h6 class="fw-semibold text-secondary mb-3">
                        Academic Information
                    </h6>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Class</span>
                        <strong th:text="${showStudentDetail.classRoomName != null ? showStudentDetail.classRoomName : 'N/A'}"></strong>
                    </div>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Version</span>
                        <strong th:text="${showStudentDetail.versionName != null ? showStudentDetail.versionName : 'N/A'}"></strong>
                    </div>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Section</span>
                        <strong th:text="${showStudentDetail.sectionName != null ? showStudentDetail.sectionName : 'N/A'}"></strong>
                    </div>

                    <div class="d-flex justify-content-between pt-2 small">
                        <span>Year</span>
                        <strong th:text="${showStudentDetail.yearName != null ? showStudentDetail.yearName : 'N/A'}"></strong>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== Documents Section ===== -->
    <div class="card shadow mt-4">
        <div class="card-body">
            <h6 class="fw-semibold text-secondary mb-3">
                Student Documents
            </h6>

            <div class="row g-3">
                <div class="col-md-4">
                    <div class="border rounded p-3 d-flex justify-content-between align-items-center">
                        <div>
                            <i class="bi bi-file-earmark-pdf fs-4 text-primary me-2"></i>
                            Date of Birth
                        </div>

                        <button class="btn btn-sm btn-primary"
                                data-bs-target="#photoModal2"
                                data-bs-toggle="modal">
                            View
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Modal ===== -->
    <div class="modal fade" id="photoModal2" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Student Date of Birth
                    </h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center">
                    <img class="img-fluid rounded"
                         style="max-height:350px;"
                         th:src="@{'/UploadFile' + ${showStudentDetail.nidDir}}">
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow mt-4" sec:authorize="hasAnyRole('ADMIN', 'REGISTER_ADMIN')">
        <div class="card-body">

            <h6 class="fw-bold mb-3">
                Student Actions
            </h6>

            <div class="d-flex flex-wrap align-items-center gap-2">

                <!-- Edit -->
                <a class="btn btn-warning btn-sm"
                   th:href="@{'/student/update/'+${showStudentDetail.id}}">
                    Edit
                </a>


                <!-- Spacer -->
                <div class="ms-auto"></div>

                <!-- Delete -->
                <button class="btn btn-danger btn-sm"
                        data-bs-toggle="modal"
                        th:data-bs-target="'#deleteModal_' + ${showStudentDetail.id}"
                        type="button">
                    Delete
                </button>

            </div>

            <!-- Delete Modal -->
            <div class="modal fade"
                 tabindex="-1"
                 th:id="'deleteModal_' + ${showStudentDetail.id}">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title text-danger">
                                Confirm Delete
                            </h5>
                            <button class="btn-close"
                                    data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            Are you sure to delete
                            <strong th:text="${showStudentDetail.name}"></strong> ?
                        </div>

                        <div class="modal-footer">
                            <button class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                Cancel
                            </button>

                            <form method="post"
                                  th:action="@{/student/delete/{id}(id=${showStudentDetail.id})}">
                                <button class="btn btn-danger">
                                    Delete
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
