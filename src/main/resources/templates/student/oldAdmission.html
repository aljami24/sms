<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div class="page-bg card mx-2 shadow" layout:fragment="content">

    <!-- ===== Page Header ===== -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">
            <i class="bi bi-person-check-fill me-2"></i> Old Student – New Admission
        </h4>

        <a class="btn btn-outline-secondary btn-sm" href="javascript:history.back()">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>

    <!-- ===== Student Basic Info ===== -->
    <div class="card shadow border-0 mb-4">
        <div class="card-header text-dark fw-semibold">
            <i class="bi bi-person-lines-fill me-1"></i> Student Information
        </div>

        <div class="card-body">
            <!-- Personal Information -->
            <h6 class="fw-bold mb-3">
                <i class="bi bi-person me-1"></i> Personal Information
            </h6>
            <div class="row g-3 mb-4">

                <div class="col-md-4">
                    <label class="fw-bold mb-1">Student Name</label>
                    <div class="p-2 bg-light rounded">
                        <span th:text="${student.name} ?: 'N/A'">Student Name</span>
                    </div>
                </div>

                <div class="col-md-2">
                    <label class="fw-bold mb-1">Roll No</label>
                    <div class="p-2 bg-light rounded">
                        <span th:text="${student.roll} ?: 'N/A'"></span>
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="fw-bold mb-1">Registration No</label>
                    <div class="p-2 bg-light rounded">
                        <span th:text="${student.registration} ?: 'N/A'"></span>
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="fw-bold mb-1">Father's Name</label>
                    <div class="p-2 bg-light rounded">
                        <span th:text="${student.fatherName} ?: 'N/A'"></span>
                    </div>
                </div>

            </div>

            <!-- Current Academic Information -->
            <h6 class="fw-bold mb-3">
                <i class="bi bi-book me-1"></i> Current Academic Information
            </h6>
            <div class="row g-3">

                <div class="col-md-3">
                    <label class="fw-bold mb-1">Class</label>
                    <div class="p-2 bg-light rounded">
                        <span th:text="${student.classRoomName} ?: 'N/A'"></span>
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="fw-bold mb-1">Version</label>
                    <div class="p-2 bg-light rounded">
                        <span th:text="${student.versionName} ?: 'N/A'"></span>
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="fw-bold mb-1">Section</label>
                    <div class="p-2 bg-light rounded">
                        <span th:text="${student.sectionName} ?: 'N/A'"></span>
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="fw-bold mb-1">Academic Year</label>
                    <div class="p-2 bg-light rounded">
                        <span th:text="${student.yearName} ?: 'N/A'"></span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ===== New Admission Form ===== -->
    <div class="card shadow border-0">
        <div class="card-header bg-light fw-semibold">
            <i class="bi bi-journal-plus me-1"></i> New Admission Details
        </div>

        <div class="card-body">
            <form method="post" th:action="@{/student/confirm-admission}">

                <!-- hidden student id -->
                <input name="studentId" th:value="${student.id}" type="hidden">

                <div class="row g-3">

                    <!-- Session/Year -->
                    <div class="col-md-3">
                        <label class="form-label">Session</label>
                        <select class="form-select" id="year" name="yearId" required>
                            <option value="">Select Session</option>
                            <option th:each="y : ${years}" th:text="${y.name}" th:value="${y.id}"></option>
                        </select>
                    </div>

                    <!-- Class -->
                    <div class="col-md-3">
                        <label class="form-label">Admitted Class</label>
                        <select class="form-select" id="classRoom" name="classRoomId" onchange="loadVersionsAndSectionsForOldAdmission(this)"
                                required>
                            <option value="">Select Class</option>
                            <option th:each="c : ${classRoom}" th:text="${c.name}" th:value="${c.id}"></option>
                        </select>
                    </div>

                    <!-- Version -->
                    <div class="col-md-3">
                        <label class="form-label">Version</label>
                        <select class="form-select" id="version" name="versionId" onchange="loadSectionsForOldAdmission()"
                                required>
                            <option value="">Select Version</option>
                            <option th:each="v : ${version}" th:text="${v.name}" th:value="${v.id}"></option>
                        </select>
                    </div>

                    <!-- Section -->
                    <div class="col-md-3">
                        <label class="form-label">Section</label>
                        <select class="form-select" id="section" name="sectionId">
                            <option value="">Select Section</option>
                            <option th:each="s : ${section}" th:text="${s.name}" th:value="${s.id}"></option>
                        </select>
                    </div>

                </div>

                <!-- Submit -->
                <div class="d-flex justify-content-end mt-4">
                    <button class="btn btn-success px-4" type="submit">
                        <i class="bi bi-check-circle me-1"></i> Confirm Admission
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Script for Cascading Dropdowns -->
    <script>
        /**
         * Old Student Admission - Class-Version-Section Cascading Dropdown Script
         * Handles: Class -> Version -> Section
         */

        // Load versions and sections when class is changed
        async function loadVersionsAndSectionsForOldAdmission(classSelect) {
            const classRoomId = classSelect.value;
            const versionSelect = document.getElementById("version");
            const sectionSelect = document.getElementById("section");

            // Clear version and section dropdowns
            versionSelect.innerHTML = '<option value="">Select Version</option>';
            sectionSelect.innerHTML = '<option value="">Select Section</option>';

            if (classRoomId) {
                try {
                    // Load versions
                    const versionRes = await fetch(`/student/versions-by-class?classRoomId=${classRoomId}`);
                    const versions = await versionRes.json();
                    versions.forEach(v => {
                        const option = document.createElement("option");
                        option.value = v.id;
                        option.text = v.name;
                        versionSelect.add(option);
                    });

                    // Load sections
                    const sectionRes = await fetch(`/student/sections-by-class?classRoomId=${classRoomId}`);
                    const sections = await sectionRes.json();
                    sections.forEach(s => {
                        const option = document.createElement("option");
                        option.value = s.id;
                        option.text = s.name;
                        sectionSelect.add(option);
                    });
                } catch (e) {
                    console.error('Error loading versions/sections:', e);
                }
            }
        }

        // Load sections when version is changed (optional - for further filtering)
        async function loadSectionsForOldAdmission() {
            const classRoomId = document.getElementById("classRoom").value;
            const versionId = document.getElementById("version").value;
            const sectionSelect = document.getElementById("section");

            sectionSelect.innerHTML = '<option value="">Select Section</option>';

            if (classRoomId && versionId) {
                try {
                    const res = await fetch(`/student/sections-by-class?classRoomId=${classRoomId}&versionId=${versionId}`);
                    const sections = await res.json();
                    sections.forEach(s => {
                        const option = document.createElement("option");
                        option.value = s.id;
                        option.text = s.name;
                        sectionSelect.add(option);
                    });
                } catch (e) {
                    console.error('Error loading sections:', e);
                }
            }
        }
    </script>


</div>
</body>
</html>
