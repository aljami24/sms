<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <style>
        body {
            background-color: lightsteelblue;
        }

        .form-card {
            background: lightslategrey;
            border-radius: 10px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: #2563eb;
            font-size: 20px;
        }

        .form-label {
            font-weight: 500;
            font-size: 14px;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px 12px;
        }

        .upload-box {
            border: 2px dashed #c7d2fe;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .upload-box:hover {
            background: #f8fafc;
            border-color: #2563eb;
        }

        .upload-box i {
            font-size: 30px;
            color: #2563eb;
        }

        .sticky-footer {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding: 14px;
            border-top: 1px solid #e5e7eb;
            text-align: right;
            border-radius: 0 0 18px 18px;
        }
    </style>
</head>

<body>

    <!-- ===== Page Header ===== -->
    <div class="mb-4">
        <h4 class="fw-bold">Student Admission</h4>
        <p class="text-muted mb-0">Fill all required information carefully</p>
    </div>

                <div class="row g-3">

                        <input class="form-control" field="*{name}" placeholder="student name" type="text">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Father Name</label>
                        <input class="form-control" field="*{father}" placeholder="father name" type="text">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Mother Name</label>
                        <input class="form-control" field="*{mother}" placeholder="mother name" type="text">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Date of Birth</label>
                        <input class="form-control" field="*{dob}" type="date">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="gender">Gender</label>
                        <select class="form-select" field="*{gender}" id="gender">
                            <option disabled selected value="">--Select--</option>
                            <option each="gender : ${gender}" text="${gender}" value="${gender}">
                        </select>
                    </div>
                    <!-- ===== Identity Type ===== -->
                    <div class="col-md-4">
                        <label class="form-label">Identity Type</label>
                        <select class="form-select" field="*{identityType}">
                            <option disabled selected value="">-- Select --</option>
                            <option value="NID">NID</option>
                            <option value="BIRTH_CERTIFICATE">Birth Certificate</option>
                            <option value="PASSPORT">Passport</option>
                        </select>
                    </div>

                    <!-- ===== Identity Number ===== -->
                    <div class="col-md-4">
                        <label class="form-label">Identity Number</label>
                        <input class="form-control"
                               field="*{identityNumber}"
                               placeholder="Enter identity number"
                               type="number">
                    </div>

                </div>
            </div>

            <div id="addressContainer">

                <div class="address-block border rounded p-3 mb-3"
                     each="addr, iterStat : *{addresses}">

                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6>Address</h6>

                        <div>
                            <button class="btn btn-sm btn-success" onclick="addAddress()"
                                    type="button">+
                            </button>

                            <button class="btn btn-sm btn-danger" onclick="removeAddress(this)"
                                    type="button">−
                            </button>
                        </div>
                    </div>

                    <!-- Address Type -->
                    <div class="mb-3">
                        <label class="form-label">Address Type</label>
                        <select class="form-select"
                                field="*{addresses[__${iterStat.index}__].addressType}">
                            <option value="">Select Address Type</option>
                            <option each="type : ${addressType}"
                                    text="${type}"
                                    value="${type}"></option>
                        </select>
                    </div>

                    <div class="row">

                        </div>
                    </div>

            <!-- ================= Document Upload ================= -->

                <div class="row g-3">

                        </div>
                    </div>

                    <i class="bi bi-save me-1"></i> Save Admission
                </button>
            </div>

<script>
    function addAddress() {
        const container = document.getElementById("addressContainer");
        const index = container.children.length;

        const template = `
        <div class="address-block border rounded p-3 mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6>Address ${index + 1}</h6>
                <div>
                    <button type="button" class="btn btn-sm btn-success" onclick="addAddress()">+</button>
                    <button type="button" class="btn btn-sm btn-danger" onclick="removeAddress(this)">−</button>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Address Type</label>
                <select class="form-select" name="addresses[${index}].addressType">
                    <option value="">Select Address Type</option>
                    <option value="PRESENT_ADDRESS">PRESENT_ADDRESS</option>
                    <option value="PERMANENT_ADDRESS">PERMANENT_ADDRESS</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">City</label>
                    <input class="form-control" name="addresses[${index}].city">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Zip Code</label>
                    <input class="form-control" name="addresses[${index}].zipCode">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Police Station</label>
                    <input class="form-control" name="addresses[${index}].policeStation">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">District</label>
                    <input class="form-control" name="addresses[${index}].district">
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label">Country</label>
                    <input class="form-control" name="addresses[${index}].country">
                </div>
            </div>
        </div>`;

        container.insertAdjacentHTML("beforeend", template);
    }

    function removeAddress(btn) {
        const container = document.getElementById("addressContainer");
        if (container.children.length > 1) {
            btn.closest(".address-block").remove();
        } else {
            alert("At least one address is required");
        }
    }
</script>
