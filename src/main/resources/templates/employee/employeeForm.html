<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>
<div layout:fragment="content">

    <!-- ===== Page Header ===== -->
    <div class="mb-4 d-flex align-items-center ps-4 gap-2">
        <i class="bi bi-person-plus-fill fs-4"></i>
        <h5 class="fw-bold mb-0">Employee Admission</h5>
    </div>

    <form method="post"
          enctype="multipart/form-data"
          th:attr="action=@{${employeeForm.id != null ? '/employee/update/' + employeeForm.id : '/employee/save'}}"
          th:object="${employeeForm}">

        <div class="form-card">

            <!-- ================= Employee Information ================= -->
            <div class="mb-5">
                <div class="section-title ">
                    <i class="bi bi-person-badge"></i>
                    Employee Information
                </div>

                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label">Employee id</label>
                        <input type="number" class="form-control" th:field="*{employeeId}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Employee Name</label>
                        <input type="text" class="form-control" th:field="*{name}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Gender</label>
                        <select class="form-select" th:field="*{gender}">
                            <option value="">-- Select Gender --</option>
                            <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" th:field="*{dob}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Joining Date</label>
                        <input type="date" class="form-control" th:field="*{joiningDate}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Employee Type</label>
                        <select class="form-select" th:field="*{employeeType}">
                            <option value="">-- Select Employ Type --</option>
                            <option th:each="t : ${employTypes}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Salary</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{salary}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" th:field="*{phoneNumber}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Identity Type</label>
                        <select class="form-select" th:field="*{identityType}">
                            <option value="">-- Select Identity --</option>
                            <option th:each="i : ${identityTypes}" th:value="${i}" th:text="${i}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Identity Number</label>
                        <input type="text" class="form-control" th:field="*{identityNumber}">
                    </div>

                </div>
            </div>

            <!-- ================= Address Information ================= -->
            <div class="mb-5">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="section-title mb-0">
                        <i class="bi bi-geo-alt-fill"></i>
                        Address Information
                    </div>
                    <button type="button" class="btn btn-sm btn-success" onclick="addAddress()">
                        <i class="bi bi-plus-lg"></i>
                    </button>
                </div>

                <div id="addressContainer">

                    <div class="address-block p-3 mb-3"
                         th:each="addr, stat : *{addressRequestDto}">

                        <div class="d-flex justify-content-between mb-2">
                            <h6>Address [[${stat.index + 1}]]</h6>
                            <button type="button"
                                    class="btn btn-sm btn-danger"
                                    onclick="removeAddress(this)"
                                    th:if="${stat.index > 0}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address Type</label>
                            <select class="form-select"
                                    th:field="*{addressRequestDto[__${stat.index}__].addressType}">
                                <option value="">Select Address Type</option>
                                <option th:each="t : ${addressTypes}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Division</label>
                                <select class="form-select division"
                                        th:field="*{addressRequestDto[__${stat.index}__].division}"
                                        onchange="loadDistricts(this)">
                                    <option value="">Select Division</option>
                                    <option th:each="d : ${divisions}" th:value="${d.id}" th:text="${d.name}"></option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">District</label>
<!--                                <select class="form-select district"-->
<!--                                        th:field="*{addressRequestDto[__${stat.index}__].district}"-->
<!--                                        onchange="loadPoliceStations(this)">-->
<!--                                    <option value="">Select District</option>-->
<!--                                </select>-->
                                <select class="form-select district"
                                        th:field="*{addressRequestDto[__${stat.index}__].district}"
                                        th:data-selected-id="*{addressRequestDto[__${stat.index}__].district?.id}"
                                        onchange="loadPoliceStations(this)">
                                    <option value="">Select District</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Police Station</label>
<!--                                <select class="form-select policeStation"-->
<!--                                        th:field="*{addressRequestDto[__${stat.index}__].policeStation}">-->
<!--                                    <option value="">Select Police Station</option>-->
<!--                                </select>-->
                                <select class="form-select policeStation"
                                        th:field="*{addressRequestDto[__${stat.index}__].policeStation}"
                                        th:data-selected-id="*{addressRequestDto[__${stat.index}__].policeStation?.id}">
                                    <option value="">Select Police Station</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Village</label>
                                <input class="form-control"
                                       th:field="*{addressRequestDto[__${stat.index}__].village}">
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- ================= Document Upload ================= -->
            <div class="mb-4">
                <div class="section-title ">
                    <i class="bi bi-upload"></i>
                    Documents
                </div>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label>Photo</label>
                        <input type="file" class="form-control" th:field="*{photo}">
                    </div>

                    <div class="col-md-4">
                        <label>NID</label>
                        <input type="file" class="form-control" th:field="*{nid}">
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a class="btn btn-secondary" type="reset">Reset</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Save Employee
                </button>
            </div>

        </div>
    </form>

    <!-- 🔹 JS: Address logic (unchanged, working) -->
    <script>
        /**
         * Employee Management - Address Cascading Dropdown Script
         * Handles: Division -> District -> Police Station
         */

        // ১. পেজ লোড হওয়ার সময় রান হবে
        window.onload = async function () {
            // প্রথমে সব বিভাগ লোড করো
            await loadDivisionsForAll();

            // তারপর যদি এটি 'Edit' পেজ হয়, তবে বিদ্যমান জেলা ও থানা লোড করো
            await loadExistingAddressesData();
        }

        // ২. সব ডাইনামিক ড্রপডাউনে বিভাগ লোড করার ফাংশন
        async function loadDivisionsForAll() {
            try {
                const response = await fetch('/student/divisions');
                const divisions = await response.json();

                document.querySelectorAll(".division").forEach(sel => {
                    // যদি আগে থেকে অপশন না থাকে তবেই যোগ করো (Duplicate প্রতিরোধ)
                    if (sel.options.length <= 1) {
                        divisions.forEach(d => {
                            const option = document.createElement("option");
                            option.value = d.id;
                            option.text = d.name;
                            sel.add(option);
                        });
                    }
                });
            } catch (error) {
                console.error('Error loading divisions:', error);
            }
        }

        // ৩. এডিট মোডে বিদ্যমান অ্যাড্রেসের ডাটা (District & PS) লোড করার মূল ফাংশন
        async function loadExistingAddressesData() {
            const addressBlocks = document.querySelectorAll(".address-block");

            for (const block of addressBlocks) {
                const divSelect = block.querySelector(".division");
                const distSelect = block.querySelector(".district");
                const psSelect = block.querySelector(".policeStation");

                // Thymeleaf থেকে আসা data-selected-id রিড করা
                const selectedDistrictId = distSelect.getAttribute("data-selected-id");
                const selectedPsId = psSelect.getAttribute("data-selected-id");

                // যদি বিভাগ সিলেক্ট করা থাকে, তবে জেলাগুলো লোড করো
                if (divSelect.value && selectedDistrictId) {
                    await loadDistrictsManual(divSelect, selectedDistrictId);
                }

                // যদি জেলা সিলেক্ট করা থাকে, তবে থানাগুলো লোড করো
                if (selectedDistrictId && selectedPsId) {
                    // এখানে একটু দেরি করা হয় যেন জেলা লোড হওয়ার পর থানা লোড হয়
                    await loadPoliceStationsManual(distSelect, selectedPsId);
                }
            }
        }

        // ৪. জেলা লোড করার ফাংশন (অন-চেইঞ্জ এবং ম্যানুয়াল লোড উভয় ক্ষেত্রে)
        async function loadDistricts(divSelect) {
            await loadDistrictsManual(divSelect, null);
        }

        async function loadDistrictsManual(divSelect, selectedId) {
            const divisionId = divSelect.value;
            const block = divSelect.closest(".address-block");
            const districtSelect = block.querySelector(".district");
            const policeSelect = block.querySelector(".policeStation");

            districtSelect.innerHTML = '<option value="">Select District</option>';
            policeSelect.innerHTML = '<option value="">Select Police Station</option>';

            if (divisionId) {
                try {
                    const res = await fetch(`/student/districts?divisionId=${divisionId}`);
                    const data = await res.json();
                    data.forEach(d => {
                        const option = document.createElement("option");
                        option.value = d.id;
                        option.text = d.name;
                        if (selectedId && d.id == selectedId) option.selected = true;
                        districtSelect.add(option);
                    });
                } catch (e) { console.error(e); }
            }
        }

        // ৫. থানা লোড করার ফাংশন (অন-চেইঞ্জ এবং ম্যানুয়াল লোড উভয় ক্ষেত্রে)
        async function loadPoliceStations(distSelect) {
            await loadPoliceStationsManual(distSelect, null);
        }

        async function loadPoliceStationsManual(distSelect, selectedId) {
            const districtId = distSelect.value;
            const psSelect = distSelect.closest(".address-block").querySelector(".policeStation");

            psSelect.innerHTML = '<option value="">Select Police Station</option>';

            if (districtId) {
                try {
                    const res = await fetch(`/student/police-stations?districtId=${districtId}`);
                    const data = await res.json();
                    data.forEach(p => {
                        const option = document.createElement("option");
                        option.value = p.id;
                        option.text = p.name;
                        if (selectedId && p.id == selectedId) option.selected = true;
                        psSelect.add(option);
                    });
                } catch (e) { console.error(e); }
            }
        }

        // ৬. নতুন অ্যাড্রেস ব্লক যোগ করা (UI)
        function addAddress() {
            const container = document.getElementById("addressContainer");
            const index = container.children.length;
            const template = `
    <div class="address-block p-3 mb-3 ">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h6>Address ${index + 1}</h6>
            <button type="button" class="btn btn-sm btn-danger" onclick="removeAddress(this)">
                <i class="bi bi-trash"></i>
            </button>
        </div>
        <div class="row">
            <div class="col-md-12 mb-3">
                <label class="form-label">Address Type</label>
                <select class="form-select" name="addressRequestDto[${index}].addressType">
                    <option value="">Select Address Type</option>
                    <option value="PRESENT_ADDRESS">PRESENT_ADDRESS</option>
                    <option value="PERMANENT_ADDRESS">PERMANENT_ADDRESS</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Division</label>
                <select class="form-select division" name="addressRequestDto[${index}].division" onchange="loadDistricts(this)">
                    <option value="">Select Division</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">District</label>
                <select class="form-select district" name="addressRequestDto[${index}].district" onchange="loadPoliceStations(this)">
                    <option value="">Select District</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Police Station</label>
                <select class="form-select policeStation" name="addressRequestDto[${index}].policeStation">
                    <option value="">Select Police Station</option>
                </select>
            </div>
            <div class="col-md-12 mb-3">
                <label class="form-label">Village</label>
                <input class="form-control" name="addressRequestDto[${index}].village">
            </div>
        </div>
    </div>`;
            container.insertAdjacentHTML("beforeend", template);
            loadDivisionsForAll(); // নতুন ব্লকের জন্য বিভাগ লোড করো
        }

        function removeAddress(btn) {
            const container = document.getElementById("addressContainer");
            if (container.children.length > 1) {
                btn.closest(".address-block").remove();
            } else {
                alert("At least one address is required");
            }
        }
    </script>


</div>
</body>
</html>
