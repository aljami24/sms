<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div class="page-bg card mx-2 shadow" layout:fragment="content">

    <!-- ===== Profile Header ===== -->
    <div class="card shadow mb-5">
        <div class="card-body">
            <div class="row align-items-center">

                <!-- Avatar -->
                <div class="col-md-3 ms-4">
                    <img alt="Employee Photo"
                         class="img-fluid rounded-circle border border-5 border-light shadow"
                         style="width:150px;height:150px;object-fit:cover;"
                         th:src="@{'/UploadFile' + ${employee.photoDir}}">
                </div>

                <!-- Name -->
                <div class="col-md-5 pt-4">
                    <h4 class="fw-bold text-dark mb-1"
                        th:text="${employee.name}">
                        Employee Name
                    </h4>

                    <span class="badge bg-light text-dark">
                        ID:
                        <span th:text="${employee.employeeId}"></span>
                    </span>
                </div>

            </div>
        </div>
    </div>

    <!-- ===== Info Section ===== -->
    <div class="row g-4">

        <!-- Personal Information -->
        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">
                        Personal Information
                    </h6>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Date of Birth</span>
                        <strong th:text="${employee.dob}"></strong>
                    </div>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Gender</span>
                        <strong th:text="${employee.gender}"></strong>
                    </div>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Phone</span>
                        <strong th:text="${employee.phoneNumber}"></strong>
                    </div>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Salary</span>
                        <strong th:text="${employee.salary}"></strong>
                    </div>

                    <div class="d-flex justify-content-between pt-2 small">
                        <span>Identity</span>
                        <strong>
                            <span th:text="${employee.identityType}"></span>
                            -
                            <span th:text="${employee.identityNumber}"></span>
                        </strong>
                    </div>
                </div>
            </div>
        </div>

        <!-- Address Information -->
        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">
                        Address Information
                    </h6>
                    <ul>
                        <li th:each="addr : ${employee.addressResponseDto}">
                            <span th:text="${addr.addressType} + ' :  ' "></span>
                            <span th:text="${addr.village} + ', ' + ${addr.policeStation?.name} + ', ' + ${addr.district?.name} + ', ' + ${addr.division?.name}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Employment Information -->
        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">
                        Employment Information
                    </h6>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Join Date</span>
                        <strong th:text="${employee.joiningDate}"></strong>
                    </div>

                    <div class="d-flex justify-content-between border-bottom py-2 small">
                        <span>Employee Type</span>
                        <strong th:text="${employee.employeeType}"></strong>
                    </div>

                    <div class="d-flex justify-content-between pt-2 small"
                         th:with="status=${employee.status.name()}">
                        <span>Status</span>
                        <strong class="badge"
                                th:classappend="${status == 'APPOINTED' ? 'bg-primary' :
                           (status == 'ACTIVATE' ? 'bg-success' :
                           (status == 'DEACTIVATE' ? 'bg-danger' : 'bg-secondary'))}">

                            <span th:text="${status == 'ACTIVATE' ? 'Active' :
                                            (status == 'DEACTIVATE' ? 'Deactivated' : #strings.capitalize(#strings.toLowerCase(status)))}">
                            </span>
                        </strong>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== Documents Section ===== -->
    <div class="card shadow mt-4">
        <div class="card-body">
            <h6 class="fw-bold mb-3">
                Employee Documents
            </h6>

            <div class="row g-3">

                <!-- NID -->
                <div class="col-md-4">
                    <div class="border rounded p-3 d-flex justify-content-between align-items-center">
                        <div>
                            <i class="bi bi-credit-card-2-front fs-4 text-primary me-2"></i>
                            NID Copy
                        </div>

                        <button class="btn btn-sm btn-primary"
                                data-bs-target="#nidModal"
                                data-bs-toggle="modal">
                            View
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ===== NID Modal ===== -->
    <div class="modal fade" id="nidModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">NID Copy</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center">
                    <img class="img-fluid rounded"
                         th:src="@{'/UploadFile' + ${employee.nidDir}}">
                </div>
            </div>
        </div>
    </div>


    <div class="card shadow mt-4">
        <div class="card-body">

            <h6 class="fw-bold mb-3">
                Employee Actions
            </h6>

            <div class="d-flex flex-wrap align-items-center gap-2">

                <!-- Edit -->
                <a class="btn btn-warning btn-sm" sec:authorize="hasAuthority('EMPLOYEE_UPDATE')"
                   th:href="@{'/employee/edit/' + ${employee.id}}">
                    Edit
                </a>

                <!-- Join / Activate Button -->
                <form method="post" th:action="@{'/employee/activate/' + ${employee.id}}"
                      th:if="${employee.status.name() == 'APPOINTED' || employee.status.name() == 'DEACTIVATE'}">
                    <button class="btn btn-success btn-sm" sec:authorize="hasAuthority('EMPLOYEE_ACTIVE')"
                            type="submit">Activate
                    </button>
                </form>

                <!-- Deactivate / Left Button -->
                <form method="post" th:action="@{'/employee/deactivate/' + ${employee.id}}"
                      th:if="${employee.status.name() == 'ACTIVATE'}">
                    <button class="btn btn-danger btn-sm" sec:authorize="hasAuthority('EMPLOYEE_DEACTIVE')"
                            type="submit">Deactivate
                    </button>
                </form>

                <!-- Spacer -->
                <div class="ms-auto"></div>

                <!-- Delete -->
                <button class="btn btn-danger btn-sm" data-bs-toggle="modal"
                        sec:authorize="hasAuthority('EMPLOYEE_DELETE')"
                        th:data-bs-target="'#deleteModal_' + ${employee.id}"
                        type="button">
                    Delete
                </button>
            </div>

            <!-- Delete Modal -->
            <div class="modal fade"
                 tabindex="-1"
                 th:id="'deleteModal_' + ${employee.id}">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title text-danger">
                                Confirm Delete
                            </h5>
                            <button class="btn-close"
                                    data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            Are you sure to delete
                            <strong th:text="${employee.name}"></strong> ?
                        </div>

                        <div class="modal-footer">
                            <button class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                Cancel
                            </button>

                            <form method="post"
                                  th:action="@{/employee/delete/{id}(id=${employee.id})}">
                                <button class="btn btn-danger">
                                    Delete
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>


</div>

</body>
</html>
