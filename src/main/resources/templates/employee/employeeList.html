<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/main}">

<head>
  <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div layout:fragment="content" class="page-bg">

  <!-- ===== Page Header ===== -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold mb-0">
      <i class="bi bi-person-badge-fill me-2"></i> Employees List
    </h5>
    <div class="d-flex justify-content-end mট-3">
      <a th:href="@{/employee/create}"
         class="btn btn-primary d-flex align-items-center gap-2 shadow-sm">
        <i class="bi bi-plus-circle"></i>
        Create Employee
      </a>
    </div>
  </div>



  <!-- ===== Filter Section ===== -->
  <div class="card filter-card shadow-sm border-0 mb-4">
    <div class="card-body">
      <form method="get" action="">
        <div class="row g-3">

          <div class="col-md-3">
            <input type="text" name="employeeId"
                   class="form-control"
                   placeholder="Employee ID">
          </div>

          <div class="col-md-3">
            <select name="employeeType" class="form-select">
              <option value="">Employee Type</option>
              <option>PERMANENT</option>
              <option>CONTRACT</option>
            </select>
          </div>

          <div class="col-md-3">
            <select name="status" class="form-select">
              <option value="">Status</option>
              <option>ACTIVE</option>
              <option>DEACTIVATE</option>
            </select>
          </div>


          <div class="col-md-3">
            <input type="text" name="name"
                   class="form-control"
                   placeholder="employee name">

          </div>

          <div class="col-md-3">
            <select name="Division" class="form-select">
              <option value="">division</option>
              <option>ACTIVE</option>
              <option>DEACTIVATE</option>
            </select>
          </div>

          <div class="col-md-3">
            <select name="District" class="form-select">
              <option value="">district</option>
              <option>ACTIVE</option>
              <option>DEACTIVATE</option>
            </select>
          </div>

          <div class="col-md-3">
            <select name="Police-station" class="form-select">
              <option value="">police-station</option>
              <option>ACTIVE</option>
              <option>DEACTIVATE</option>
            </select>
          </div>

          <div class="col-md-2 d-grid">
            <button class="btn btn-success">
              <i class="bi bi-search me-1"></i> Search
            </button>
          </div>

        </div>
      </form>
    </div>
  </div>

  <!-- ===== Table Section ===== -->
  <div class="card table-card shadow-sm border-0">
    <div class="card-body p-0">

      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-success">
          <tr>
            <th style="width: 5%;" class="text-center">Sl</th>
            <th style="width: 30%;" class="text-start">Employee Details</th>
            <th style="width: 15%;" class="text-center">Salary</th>
            <th style="width: 40%;" class="text-start">Address</th>
            <th style="width: 10%;" class="text-center">Status</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="employee,stat : ${employees}">
            <td class="text-center" th:text="${stat.count}">1</td>
            <td>
              <span><strong>ID :</strong> <span th:text="${employee.employeeId}"></span></span><br>
              <span><strong>Name :</strong><a th:href="@{'/employee/view/' + ${employee.id}}"
                                              class="text-decoration-none link-success link-underline-opacity-0 link-underline-opacity-100-hover">
                <span class="text-success" th:text="${employee.name}"></span></a>
              </span><br>
              <span><strong>Phone :</strong> <span th:text="${employee.phoneNumber}"></span></span>
            </td>
            <td class="text-center" th:text="${employee.salary}">0</td>
            <td>
              <ul>
                <li th:each="addr : ${employee.addressResponseDto}">
                  <span class="fw-bold" th:text="${addr.addressType} + ' :  ' "></span>
                  <span th:text="${addr.village + ', ' + addr.policeStation?.name + ', ' + addr.district?.name + ', ' + addr.division?.name}"></span>
                </li>
              </ul>
            </td>
            <td class="text-center" th:text="${employee.status}">25000</td>
          </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <nav aria-label="Page navigation example" class="mt-2">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
        <a class="page-link" th:href="@{/employee/list(page = ${currentPage - 1})}">Previous</a>
      </li>
      <li class="page-item" th:each=" i : ${#numbers.sequence(0,totalPages -1)}"
          th:classappend="${i == currentPage} ? 'active' : ''">
        <a class="page-link" th:text="${i + 1}" th:href="@{/employee/list(page = ${i})}">1</a>
      </li>
      <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
        <a class="page-link" th:href="@{/employee/list(page = ${currentPage + 1})}">Next</a>
      </li>
    </ul>
  </nav>

</div>

</body>
</html>
