<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>
<div layout:fragment="content" class="page-bg card shadow mx-2">

    <div class="container-fluid mt-4">

        <!-- ===== Page Header ===== -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0">
                <i class="bi bi-person-badge-fill me-2"></i>All Payments
            </h5>
            <div class="d-flex justify-content-end mট-3">
                <a th:href="@{/income/form}"
                   class="btn" id="btn">Add Income</a>
            </div>
        </div>

        <!-- Filter Card -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form class="row g-3 align-items-end">

                    <!-- Payment Type -->
                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Payment Type</label>
                        <select class="form-select">
                            <option value="">All</option>
                            <option value="CASH">Admission Fee</option>
                            <option value="ONLINE">Tuition Fee</option>
                            <option value="BANK">Exam Fee</option>
                            <option value="BANK">Others</option>
                        </select>
                    </div>

                    <!-- Payment Type -->
                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Payment Method</label>
                        <select class="form-select">
                            <option value="">All</option>
                            <option value="CASH">Cash</option>
                            <option value="ONLINE">Nogod</option>
                            <option value="BANK">Bkash</option>
                            <option value="BANK">Bank</option>
                        </select>
                    </div>

                    <!-- Month -->
                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Month</label>
                        <select class="form-select">
                            <option value="">All</option>
                            <option>January</option>
                            <option>February</option>
                            <option>March</option>
                            <option>April</option>
                        </select>
                    </div>

                    <!-- Date -->
                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Payment Date</label>
                        <input type="date" class="form-control">
                    </div>

                    <!-- Buttons -->
                    <div class="col-md-3 text-end">
                        <button type="submit" class="btn btn-primary me-2">
                            Filter
                        </button>
                        <button type="reset" class="btn btn-outline-secondary">
                            Reset
                        </button>
                    </div>

                </form>
            </div>
        </div>

        <!-- Payment List -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-success">
                        <tr>
                            <th class="text-center">Sl</th>
                            <th class="text-center">Date</th>
                            <th class="text-center">Month</th>
                            <th class="text-center">Payment Method</th>
                            <th class="text-center">Payment Type</th>
                            <th class="text-center">Amount</th>
                            <th class="text-center">Status</th>
                            <th class="text-center">Action</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr>
                            <td class="text-center">1</td>
                            <td class="text-center">12 Jan 2026</td>
                            <td class="text-center">January</td>
                            <td class="text-center">Cash</td>
                            <td class="text-center">Tuition Fee</td>
                            <td class="fw-semibold text-center">৳ 2,000</td>
                            <td class="text-center">
                                <span class="badge bg-success">Paid</span>
                            </td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-primary">View</button>
                            </td>
                        </tr>

                        <tr>
                            <td class="text-center">2</td>
                            <td class="text-center">05 Feb 2026</td>
                            <td class="text-center">February</td>
                            <td class="text-center">Nogod</td>
                            <td class="text-center">Admission Fee</td>
                            <td  class="fw-semibold text-center">৳ 2,500</td>
                            <td class="text-center">
                                <span class="badge bg-warning text-dark">Pending</span>
                            </td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-primary">View</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>


</div>
</body>
</html>
