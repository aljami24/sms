<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
  <th:block th:replace="layout/header :: head"></th:block>
  <style>
    .invoice-card { max-width: 850px; margin: 30px auto; border-radius: 12px; }
    .invoice-header { background-color: #f8f9fa; border-bottom: 2px solid #dee2e6; padding: 20px; text-align: center; }
    .info-table, .summary-table { width: 100%; border-collapse: collapse; }
    .info-table td, .summary-table td { padding: 10px; font-size: 15px; }
    .label-col { text-align: right; width: 40%; font-weight: 600; color: #495057; }
    .sep-col { text-align: center; width: 5%; font-weight: bold; }
    .value-col { text-align: left; width: 55%; color: #212529; }
    .total-row { background-color: #f1f8ff; font-size: 18px; font-weight: bold; }
    .section-title { font-weight: bold; border-bottom: 1px solid #ddd; margin-bottom: 15px; padding-bottom: 5px; color: #0d6efd; }
    .payment-method-box { width: 120px; height: 120px; border: 2px solid #ddd; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; cursor: pointer; transition: all 0.3s ease; }
    .payment-method-box:hover { border-color: #0d6efd; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .payment-method-box.selected { border-color: #0d6efd; background-color: #e7f1ff; }
    .gateway-logo { max-width: 60px; max-height: 60px; object-fit: contain; }

     /* 🔥 PRINT ONLY INVOICE */
    @media print {

      body * {
        visibility: hidden;
      }

      .invoice-card, .invoice-card * {
        visibility: visible;
      }

      .invoice-card {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }

      .no-print {
        display: none !important;
      }
    }
  </style>
</head>

<body>
<div layout:fragment="content" class="page-bg card mx-2 shadow">

  <div class="container-fluid">
    <div class=" invoice-card">

      <!-- HEADER -->
      <div class="invoice-header">
        <h3 class="fw-bold mb-0"
            th:text="${pageTitle}">
        </h3>
        <small class="text-muted">
          Academic Year:
          <span th:text="${invoice.year.name}"></span>
        </small>
      </div>

      <div class="card-body p-4">

        <!-- SUCCESS MESSAGE -->
        <div th:if="${successMessage}" class="alert alert-success text-center">
          <span th:text="${successMessage}"></span>
        </div>

        <!-- STUDENT INFO -->
        <div class="section-title">Student Information</div>

        <div class="row mb-4">
          <div class="col-md-12">
            <table class="info-table">
              <tr>
                <td class="label-col">Student Name</td>
                <td class="sep-col">:</td>
                <td class="value-col fw-bold" th:text="${invoice.student.name}"></td>
              </tr>
              <tr>
                <td class="label-col">Father's Name</td>
                <td class="sep-col">:</td>
                <td class="value-col" th:text="${invoice.student.fatherName}"></td>
              </tr>
              <tr>
                <td class="label-col">Registration Number</td>
                <td class="sep-col">:</td>
                <td class="value-col" th:text="${invoice.student.registration}"></td>
              </tr>
            </table>
          </div>
        </div>

        <!-- PAYMENT SUMMARY -->
        <div class="section-title">Payment Summary</div>

        <div class="row mb-4">
          <div class="col-md-12">
            <table class="summary-table">

              <tr th:each="item : ${invoice.invoiceItems}">
                <td class="label-col" th:text="${item.feeType}"></td>
                <td class="sep-col">:</td>
                <td class="value-col">
                  <span th:text="${#numbers.formatDecimal(item.itemTotal,1,2)}"></span> ৳
                  <div th:if="${item.remarks != null}"
                       class="text-muted small"
                       th:text="${item.remarks}">
                  </div>
                </td>
              </tr>

              <tr>
                <td class="label-col">Paid Amount</td>
                <td class="sep-col">:</td>
                <td class="value-col text-success">
                  <span th:text="${#numbers.formatDecimal(invoice.paidAmount,1,2)}"></span> ৳
                </td>
              </tr>

              <tr>
                <td class="label-col">Due Amount</td>
                <td class="sep-col">:</td>
                <td class="value-col text-danger">
                  <span th:text="${#numbers.formatDecimal(invoice.dueAmount,1,2)}"></span> ৳
                </td>
              </tr>

              <tr class="total-row border-top">
                <td class="label-col text-primary">Total Payable Amount</td>
                <td class="sep-col text-primary">:</td>
                <td class="value-col text-primary">
                  <span th:text="${#numbers.formatDecimal(invoice.totalAmount,1,2)}"></span> ৳
                </td>
              </tr>

            </table>
          </div>
        </div>

        <!-- PAYMENT FORM -->
        <div th:if="${invoice.dueAmount > 0}">

          <div class="text-center mt-5">
            <h6 class="fw-bold mb-3">SELECT PAYMENT METHOD</h6>

            <div class="d-flex justify-content-center flex-wrap gap-3">

              <div class="payment-method-box selected" data-method="NAGAD">
                <img src="https://i.ibb.co/8g2t0C6/nagad.png" class="gateway-logo">
                <span class="mt-1 d-block fw-semibold">Nagad</span>
              </div>

              <div class="payment-method-box" data-method="BKASH">
                <img src="https://i.ibb.co/5R9KXcX/bkash.png" class="gateway-logo">
                <span class="mt-1 d-block fw-semibold">Bkash</span>
              </div>

              <div class="payment-method-box" data-method="BANK">
                <img src="https://i.ibb.co/HT5f3vS/bank.png" class="gateway-logo">
                <span class="mt-1 d-block fw-semibold">Bank</span>
              </div>

              <div class="payment-method-box" data-method="CASH">
                <img src="https://i.ibb.co/Xt6BxGn/card.png" class="gateway-logo">
                <span class="mt-1 d-block fw-semibold">Cash</span>
              </div>

            </div>
          </div>

          <form th:action="@{/payments/collect}" method="post">

            <input type="hidden" name="invoiceId" th:value="${invoice.id}"/>
            <input type="hidden" id="selectedMethod" name="paymentMethod" value="NAGAD"/>
            <input type="hidden" name="amount" th:value="${invoice.dueAmount}"/>

            <div class="mt-4 text-center">
              <button type="submit"
                      class="btn btn-primary btn-lg px-5 fw-bold shadow">
                Pay Now
              </button>
            </div>

          </form>

        </div>

        <!-- যদি পুরো পেমেন্ট হয়ে যায় -->
        <div th:if="${invoice.dueAmount == 0}" class="text-center mt-4 no-print">
          <button type="button"
                  class="badge bg-success p-3 fs-6 border-0"
                  onclick="printInvoice()"
                  style="cursor:pointer;">
            🖨 Print
          </button>
        </div>

      </div>
    </div>
  </div>

  <script>
    const boxes = document.querySelectorAll('.payment-method-box');
    const methodInput = document.getElementById('selectedMethod');

    boxes.forEach(box => {
      box.addEventListener('click', () => {
        boxes.forEach(b => b.classList.remove('selected'));
        box.classList.add('selected');
        methodInput.value = box.getAttribute('data-method');
      });
    });

    function printInvoice() {
        window.print();
    }
  </script>

</div>
</body>
</html>
