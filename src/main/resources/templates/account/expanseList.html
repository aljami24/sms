<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">

<head>
  <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>
<div layout:fragment="content" class="page-bg card shadow mx-2">

  <div class="container-fluid mt-4">

    <!-- ===== Page Header ===== -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">
        <i class="bi bi-cash-coin me-2"></i>All Expenses
      </h5>
      <div class="d-flex justify-content-end mt-3">
        <a th:href="@{/expense/form}"
           class="btn" id="btn">Add Expense</a>
      </div>
    </div>

    <!-- ===== Filter Card ===== -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form class="row g-3 align-items-end">

          <!-- Expense Category -->
          <div class="col-md-2">
            <label class="form-label fw-semibold">Expense Category</label>
            <select class="form-select">
              <option value="">All</option>
              <option>Salary</option>
              <option>Electricity</option>
              <option>Rent</option>
              <option>Maintenance</option>
              <option>Others</option>
            </select>
          </div>

          <!-- Payment Method -->
          <div class="col-md-2">
            <label class="form-label fw-semibold">Payment Method</label>
            <select class="form-select">
              <option value="">All</option>
              <option>Cash</option>
              <option>Bkash</option>
              <option>Nagad</option>
              <option>Bank</option>
            </select>
          </div>

          <!-- Month -->
          <div class="col-md-2">
            <label class="form-label fw-semibold">Month</label>
            <select class="form-select">
              <option value="">All</option>
              <option>January</option>
              <option>February</option>
              <option>March</option>
              <option>April</option>
            </select>
          </div>

          <!-- Date -->
          <div class="col-md-2">
            <label class="form-label fw-semibold">Expense Date</label>
            <input type="date" class="form-control">
          </div>

          <!-- Buttons -->
          <div class="col-md-3 text-end">
            <button type="submit" class="btn btn-primary me-2">
              Filter
            </button>
            <button type="reset" class="btn btn-secondary">
              Reset
            </button>
          </div>

        </form>
      </div>
    </div>

    <!-- ===== Expense List ===== -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-success">
            <tr>
              <th class="text-center">Sl</th>
              <th class="text-center">Date</th>
              <th class="text-center">Month</th>
              <th class="text-center">Category</th>
              <th class="text-center">Payment Method</th>
              <th class="text-center">Amount</th>
              <th class="text-center">Status</th>
              <th class="text-center">Action</th>
            </tr>
            </thead>

            <tbody>
            <tr>
              <td class="text-center">1</td>
              <td class="text-center">10 Jan 2026</td>
              <td class="text-center">January</td>
              <td class="text-center">Electricity</td>
              <td class="text-center">Cash</td>
              <td class="fw-semibold text-center text-danger">৳ 5,000</td>
              <td class="text-center">
                <span class="badge bg-success">Paid</span>
              </td>
              <td class="text-center">
                <button class="btn btn-sm btn-outline-primary">View</button>
              </td>
            </tr>

            <tr>
              <td class="text-center">2</td>
              <td class="text-center">18 Feb 2026</td>
              <td class="text-center">February</td>
              <td class="text-center">Salary</td>
              <td class="text-center">Bank</td>
              <td class="fw-semibold text-center text-danger">৳ 25,000</td>
              <td class="text-center">
                <span class="badge bg-warning text-dark">Pending</span>
              </td>
              <td class="text-center">
                <button class="btn btn-sm btn-outline-primary">View</button>
              </td>
            </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

</div>
</body>
</html>
