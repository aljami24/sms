<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>
<div th:fragment="navbar" class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-light ">

        <div class="container-fluid">

            <!-- Mobile Sidebar Toggle -->
            <button class="navbar-toggler d-lg-none"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#mobileSidebar"
                    aria-label="Toggle sidebar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Right Side -->
            <ul class="navbar-nav ms-auto align-items-center">

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle d-flex align-items-center"
                       href="javascript:void(0)"
                       data-bs-toggle="dropdown">

                        <div class="bg-primary text-white rounded-circle d-flex
                                align-items-center justify-content-center me-2"
                             style="width:30px;height:30px;">
                            <i class="bi bi-person-fill"></i>
                        </div>

                        <div th:if="${user != null}">
                            <span th:text="${user.username}">User</span><br>
                            <small class="text-muted"
                                   th:if="${user != null and !user.roles.isEmpty()}"
                                   th:text="${#strings.listJoin(user.getUserRoles(), ', ')}">
                            </small>
                        </div>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                        <li class="px-3 py-2">
                            <div class="fw-bold" sec:authentication="name" ></div>
                            <div class="small text-muted">

                                <small class="text-muted"
                                       th:if="${user != null and !user.roles.isEmpty()}"
                                       th:text="${#strings.listJoin(user.getUserRoles(), ', ')}">
                                </small>
                            </div>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>

            </ul>
        </div>
    </nav>


    <!-- ================= MOBILE SIDEBAR (80%) ================= -->
    <div class="offcanvas offcanvas-start d-lg-none"
         tabindex="-1"
         id="mobileSidebar"
         style="width:80%;">

        <div class="offcanvas-header">
            <h5 class="mb-0">SMH SMS</h5>
            <button type="button" class="btn-close"
                    data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body p-0">

            <div class="sidebar-menu">

                <a class="menu-link" th:href="@{/}">Dashboard</a>

                <div class="menu-item">
                    <a class="menu-toggle" data-target="m-students">
                        <span><i class="bi bi-people me-2"></i> Students</span>
                        <i class="bi bi-chevron-right arrow"></i>
                    </a>
                    <div class="submenu" id="m-students">
                        <a class="sub-link" th:href="@{/student/list}"
                           sec:authorize="hasAnyRole('ADMIN', 'REGISTER_ADMIN', 'ACCOUNT_ADMIN')">Student List</a>
                    </div>
                </div>

                <div class="menu-item">
                    <a class="menu-toggle" data-target="m-employees">
                        <span><i class="bi bi-people me-2"></i> Employee</span>
                        <i class="bi bi-chevron-right arrow"></i>
                    </a>
                    <div class="submenu" id="m-employees">
                        <a class="sub-link" th:href="@{/employee/list}"
                           sec:authorize="hasAnyRole('ADMIN', 'REGISTER_ADMIN', 'ACCOUNT_ADMIN')">Employee List</a>
                    </div>
                </div>

                <div class="menu-item">
                    <a class="menu-toggle" data-target="m-account">
                        <span><i class="bi bi-wallet2 me-2"></i> Account</span>
                        <i class="bi bi-chevron-right arrow"></i>
                    </a>
                    <div class="submenu" id="m-account">
                        <a class="sub-link" href="/account/accountIncome">Pay Income</a>
                        <a class="sub-link" href="/account/accountExpense">Pay Expense</a>
                        <a class="sub-link" href="/account/accountSummary">Summary</a>
                    </div>
                </div>

                <div class="menu-item">
                    <a class="menu-toggle" data-target="m-reports">
                        <span><i class="bi bi-people me-2"></i> Report</span>
                        <i class="bi bi-chevron-right arrow"></i>
                    </a>
                    <div class="submenu" id="m-reports">
                        <a class="sub-link" href="@{/report/list}"
                           sec:authorize="hasAnyRole('ADMIN', 'REGISTER_ADMIN', 'ACCOUNT_ADMIN')">Report List</a>
                    </div>
                </div>

            </div>

        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
