<!doctype html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <title th:text="${title}">School Management</title>

    <style>
        :root {
            --primary: #6c63ff;
            --sidebar-bg: #4b4a86;
            --bg-light: #f4f6fb;
        }

        body {
            background-color: var(--bg-light);
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 18%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: var(--sidebar-bg);
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* Sidebar header/logo */
        .sidebar-header {
            flex: 0 0 auto;
            display: flex; /* Flex layout */
            align-items: center; /* Vertically center */
            padding: 11px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            gap: 12px; /* Logo & name spacing */
        }

        .sidebar-header .logo-circle {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.8;
            flex-shrink: 0; /* Prevent shrinking */
        }

        .sidebar-header h5 {
            margin: 0;
            font-weight: bold;
            color: #fff;
            font-size: 1.1rem;
        }

        /* Sidebar menu (scrollable) */
        .sidebar-menu {
            flex: 1 1 auto;
            overflow-y: auto;
        }

        .menu-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            color: #e0e0ff;
            text-decoration: none;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .menu-toggle .arrow {
            transition: transform 0.3s ease;
        }

        .menu-toggle[aria-expanded="true"] .arrow {
            transform: rotate(90deg);
        }

        .submenu {
            background: rgba(0, 0, 0, 0.15);
        }

        .sub-link {
            padding: 8px 40px;
            display: block;
            font-size: 14px;
            color: #d1d1ff;
            text-decoration: none;
        }

        .sub-link:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* Custom scrollbar */
        .sidebar-menu::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-menu::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .sidebar-menu::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ===== Main Area ===== */
        .main-wrapper {
            margin-left: 18%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<body>

<!-- ===== Sidebar ===== -->
<div class="sidebar">
    <!-- Sidebar header/logo -->
    <div class="sidebar-header">
        <div class="logo-circle">
            <i class="bi bi-mortarboard-fill fs-3 text-white"></i>
        </div>
        <h5>SM Atik SMS</h5>
    </div>

    <!-- Sidebar Menu -->
    <div class="sidebar-menu">

        <a class="menu-toggle" th:href="@{/}">
            <span><i class="bi bi-speedometer2 me-2"></i> Dashboard</span>
        </a>

        <!-- Students Menu -->
        <a class="menu-toggle" data-bs-toggle="collapse" href="#students">
            <span><i class="bi bi-people me-2"></i> Students</span>
            <i class="bi bi-chevron-right arrow"></i>
        </a>
        <div class="collapse submenu" id="students">
            <a class="sub-link" th:href="@{/student/all}">Student List</a>
            <a class="sub-link" th:href="@{/student/create}">Add Student</a>
        </div>

        <!-- Teachers Menu -->
        <a class="menu-toggle" data-bs-toggle="collapse" href="#teachers">
            <span><i class="bi bi-person-badge me-2"></i> Employee</span>
            <i class="bi bi-chevron-right arrow"></i>
        </a>
        <div class="collapse submenu" id="teachers">
            <a class="sub-link" th:href="@{/employee/list}">Employee List</a>
            <a class="sub-link" th:href="@{/employee/create}">Add Employee</a>
        </div>

        <!-- Classes Menu -->
        <a class="menu-toggle" data-bs-toggle="collapse" href="#classes">
            <span><i class="bi bi-journal-text me-2"></i> Classes</span>
            <i class="bi bi-chevron-right arrow"></i>
        </a>
        <div class="collapse submenu" id="classes">
            <a class="sub-link" href="#">Class List</a>
            <a class="sub-link" href="#">Add Class</a>
        </div>

        <!-- Attendance Menu -->
        <a class="menu-toggle" data-bs-toggle="collapse" href="#attendance">
            <span><i class="bi bi-calendar-check me-2"></i> Attendance</span>
            <i class="bi bi-chevron-right arrow"></i>
        </a>
        <div class="collapse submenu" id="attendance">
            <a class="sub-link" th:href="@{/attendance/attendanceStudentView}">Student Attendance</a>
            <a class="sub-link" th:href="@{/attendance/attendanceStudentForm}">Add Student Attendance</a>
            <a class="sub-link" th:href="@{/attendance/attendanceEmployeeView}">Employee Attendance</a>
            <a class="sub-link" th:href="@{/attendance/attendanceEmployeeForm}">Add Employee Attendance</a>
        </div>

        <!-- Account Menu -->
        <a class="menu-toggle" data-bs-toggle="collapse" href="#account">
            <span><i class="bi bi-wallet2 me-2"></i> Account</span>
            <i class="bi bi-chevron-right arrow"></i>
        </a>
        <div class="collapse submenu" id="account">
            <a class="sub-link" href="#">Fee List</a>
            <a class="sub-link" href="#">Add Payment</a>
        </div>

        <!-- Report Menu -->
        <a class="menu-toggle" data-bs-toggle="collapse" href="#report">
            <span><i class="bi bi-bar-chart-line me-2"></i> Report</span>
            <i class="bi bi-chevron-right arrow"></i>
        </a>
        <div class="collapse submenu" id="report">
            <a class="sub-link" href="#">Student Report</a>
            <a class="sub-link" href="#">Teacher Report</a>
        </div>


    </div>
</div>

<!-- ===== Main Content ===== -->
<div class="main-wrapper">

    <!-- Navbar -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <!-- Dynamic Content -->
    <div class="container-fluid py-4" layout:fragment="content"></div>

    <!-- Footer -->
    <div th:replace="~{layout/footer :: footer}"></div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
