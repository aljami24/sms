<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #dbeafe;
            height: 100vh;
        }

        .error-card {
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,.1);
        }

        .error-code {
            font-size: 72px;
            font-weight: 800;
            color: #ef4444;
        }

        .error-status {
            letter-spacing: 0.1em;
            font-weight: 600;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center">

<div class="card error-card p-5 text-center bg-white">
    <div class="error-code" th:text="${responseApi.code}">500</div>

    <div class="error-status text-danger mb-3"
         th:text="${responseApi.status}">
        ERROR
    </div>

    <h5 class=" mb-2"
        style="white-space: pre-line;"
        th:text="${responseApi.message}">

    </h5>

    <p class="text-muted small"
       th:text="${responseApi.data}">
        /employee-attendance
    </p>

    <div class="mt-4">
        <a href="/" class="btn btn-primary rounded-pill px-4">
            Go Home
        </a>
        <a href="javascript:history.back()"
           class="btn btn-outline-secondary rounded-pill px-4">
            Go Back
        </a>
    </div>
</div>

</body>
</html>
