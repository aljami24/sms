<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout/main}">
<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>
<body>
<div layout:fragment="content" class="page-bg card mx-2 shadow">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0"> Employee attendance (Active Only)</h4>
        <div class="d-flex align-items-center">
            <label class="me-2 mb-0">Date:</label>
            <input type="text" class="form-control form-control-sm" th:value="${today}" readonly style="width: 150px;">
        </div>
    </div>

    <div class="card-body">
        <form th:action="@{/attendance/employee}" method="get" class="row g-3 mb-4">
            <div class="col-md-3">
                <select name="employeeType" class="form-select" onchange="this.form.submit()">
                    <option value="">-- All --</option>
                    <option th:each="t : ${employeeTypes}" th:value="${t}"
                            th:text="${t}" th:selected="${t == filter.employeeType}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <input type="text" name="name" class="form-control" placeholder="Employee Name" th:value="${filter.name}">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-secondary w-100"> Search </button>
            </div>
        </form>

        <form th:action="@{/attendance/employee/save}" method="post">
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-light">
                    <tr>
                        <th width="150">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="selectAll" checked>
                                <label class="form-check-label fw-bold" for="selectAll"> Select All </label>
                            </div>
                        </th>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th class="text-center">PRESENT(On) ABSENT(Off) </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="emp : ${employees}">
                        <input type="hidden" name="allDisplayedIds" th:value="${emp.id}">

                        <td></td>
                        <td th:text="${emp.employeeId}"></td>
                        <td th:text="${emp.name}"></td>
                        <td th:text="${emp.employeeType}"></td>
                        <td class="text-center">
                            <div class="form-check form-switch d-flex justify-content-center">
                                <input class="form-check-input attendance-check" type="checkbox"
                                       th:name="'status_' + ${emp.id}" checked>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${employees.empty}">
                        <td colspan="5" class="text-center text-danger">No active employees found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="text-end mt-3">
                <button type="submit" class="btn btn-success px-5 shadow-sm">Submit attendance</button>
            </div>
        </form>
    </div>

    <script>
        // Select All/Unselect All logic
        document.getElementById('selectAll').addEventListener('change', function() {
            let checkboxes = document.querySelectorAll('.attendance-check');
            checkboxes.forEach(cb => cb.checked = this.checked);
        });
    </script>
</div>
</body>
</html>
