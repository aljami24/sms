<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/main}">
<body>
<div layout:fragment="content" class="container mt-5">
  <div class="card shadow mx-auto" style="max-width: 500px;">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0 text-center"> Change attendance </h5>
    </div>
    <div class="card-body text-center">
      <div class="mb-4">
        <p class="mb-1 text-muted">Employee Name</p>
        <h4 th:text="${attendance.employeeId.name}">Employee Name</h4>
        <p class="mb-1 text-muted">Date</p>
        <h5 th:text="${attendance.date}">2026-02-09</h5>
      </div>

      <div class="alert" th:classappend="${attendance.status.name() == 'PRESENT' ? 'alert-success' : 'alert-danger'}">
        Current status: <strong th:text="${attendance.status}">PRESENT</strong>
      </div>

      <hr>

      <form th:action="@{/attendance/update-status}" method="post">
        <input type="hidden" name="id" th:value="${attendance.id}">
        <input type="hidden" name="date" th:value="${attendance.date}">

        <div th:if="${attendance.status.name() == 'PRESENT'}">
          <input type="hidden" name="status" value="ABSENT">
          <button type="submit" class="btn btn-danger btn-lg w-100 shadow-sm">
            <i class="bi bi-x-circle me-2"></i> Absent
          </button>
        </div>

        <div th:if="${attendance.status.name() == 'ABSENT'}">
          <input type="hidden" name="status" value="PRESENT">
          <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm">
            <i class="bi bi-check-circle me-2"></i> Present
          </button>
        </div>
      </form>

      <a th:href="@{/attendance/list(date=${attendance.date})}" class="btn btn-link mt-3 text-decoration-none">
        <i class="bi bi-arrow-left"></i> Back
      </a>
    </div>
  </div>
</div>
</body>
</html>
