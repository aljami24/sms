<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{layout/main}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="layout/header :: head"></th:block>
</head>

<body>

<div class="container py-4" layout:fragment="content">

    <!-- ===== Page Header ===== -->
    <div class="card shadow-sm mb-4">
        <div class="card-body d-flex align-items-center">
            <i class="bi bi-file-earmark-text fs-3 text-primary me-3"></i>
            <div>
                <h4 class="mb-0 fw-bold">Reports List</h4>
            </div>
        </div>
    </div>


    <!-- ===== Row 1 ===== -->
    <div class="row mb-5">
        <div class="col-12 mb-2">
            <!-- Headline with divider (Bootstrap border-bottom) -->
            <h5 class="fw-bold border-bottom pb-2">Student Reports</h5>
        </div>

        <div class="col-md-6 mb-3 d-flex align-items-center">
            <span class="badge bg-success rounded-circle me-3"
                  style="width:30px; height:30px; display:flex; align-items:center; justify-content:center;">01</span>
            <a class="text-success text-decoration-none" href="/reports/student-fee"
               onmouseout="this.classList.remove('text-decoration-underline');"
               onmouseover="this.classList.add('text-decoration-underline');">
                Fee Collection Report
            </a>
        </div>

        <div class="col-md-6 mb-3 d-flex align-items-center">
            <span class="badge bg-success rounded-circle me-3"
                  style="width:30px; height:30px; display:flex; align-items:center; justify-content:center;">02</span>
            <a class="text-success text-decoration-none" href="/reports/student-attendance"
               onmouseout="this.classList.remove('text-decoration-underline');"
               onmouseover="this.classList.add('text-decoration-underline');">
                Attendance Report
            </a>
        </div>
    </div>

    <!-- ===== Row 2 ===== -->
    <div class="row mb-5">
        <div class="col-12 mb-2">
            <h5 class="fw-bold border-bottom pb-2">Finance Reports</h5>
        </div>

        <div class="col-md-6 mb-3 d-flex align-items-center">
            <span class="badge bg-warning text-dark rounded-circle me-3"
                  style="width:30px; height:30px; display:flex; align-items:center; justify-content:center;">01</span>
            <a class="text-success text-decoration-none" href="/reports/student-fee"
               onmouseout="this.classList.remove('text-decoration-underline');"
               onmouseover="this.classList.add('text-decoration-underline');">
                Fee Collection Report
            </a>
        </div>

        <div class="col-md-6 mb-3 d-flex align-items-center">
            <span class="badge bg-warning text-dark rounded-circle me-3"
                  style="width:30px; height:30px; display:flex; align-items:center; justify-content:center;">02</span>
            <a class="text-success text-decoration-none" href="/reports/monthly-income"
               onmouseout="this.classList.remove('text-decoration-underline');"
               onmouseover="this.classList.add('text-decoration-underline');">
                Income Summary Report
            </a>
        </div>
    </div>


</div>

</body>
</html>
